name: Automerge

# Squash-merges pull requests labeled `automerge` once the CI workflow is green for their head commit,
# then deletes the branch. Runs when CI completes and when the label is added.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  merge:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'automerge')
    steps:
      - name: Merge if labeled and CI is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number,labels,headRefOid \
            --jq '[.[] | select(.headRefOid == env.HEAD_SHA) | select(any(.labels[]; .name == "automerge"))][0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open PR with label automerge for $HEAD_BRANCH@$HEAD_SHA."; exit 0
          fi
          conclusion=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=pull_request" \
            --jq '[.workflow_runs[] | select(.status == "completed")] | sort_by(.created_at) | last | .conclusion // empty')
          if [ "$conclusion" != "success" ]; then
            echo "CI for $HEAD_SHA is not green yet (conclusion: ${conclusion:-none}). Waiting for the next CI run."; exit 0
          fi
          gh pr merge "$pr" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"
