competency: performance-feedback
items:
  - id: pf-f-purpose
    level: foundation
    difficulty: 900
    type: single
    stem:
      en: "What best describes a performance appraisal?"
      de: "Was beschreibt eine Leistungsbeurteilung am besten?"
    options:
      - en: "A periodic process in which job performance is documented and evaluated, often by the manager"
        de: "Ein regelmäßiger Prozess, in dem die Arbeitsleistung dokumentiert und bewertet wird, oft durch die Führungskraft"
        correct: true
      - en: "A one-off decision by the hiring manager about whether to hire someone after the interviews have ended"
        de: "Eine einmalige Entscheidung der Führungskraft, ob nach den Interviews jemand eingestellt wird"
        correct: false
      - en: "A list of tasks handed over to the employee at the start of the year that nobody needs to discuss later"
        de: "Eine Liste von Aufgaben, die zu Jahresbeginn übergeben wird und über die später niemand sprechen muss"
        correct: false
      - en: "A payroll calculation that converts hours worked and the agreed rate into the monthly gross pay"
        de: "Eine Entgeltberechnung, die geleistete Stunden und den vereinbarten Satz in das monatliche Bruttoentgelt umrechnet"
        correct: false
    explanation:
      en: "A performance appraisal is a periodic process in which job performance is documented and evaluated, most often by the immediate manager."
      de: "Eine Leistungsbeurteilung ist ein regelmäßiger Prozess, in dem die Arbeitsleistung dokumentiert und bewertet wird, meist durch die direkte Führungskraft."
    source: https://en.wikipedia.org/wiki/Performance_appraisal
  - id: pf-f-goal
    level: foundation
    difficulty: 950
    type: single
    stem:
      en: "Which of these is a goal rather than a task?"
      de: "Welche der folgenden Aussagen ist ein Ziel und keine Aufgabe?"
    options:
      - en: "Send the monthly report to the managers"
        de: "Den Monatsbericht an die Führungskräfte senden"
        correct: false
      - en: "Managers receive reliable figures by the fifth working day"
        de: "Führungskräfte erhalten bis zum fünften Arbeitstag verlässliche Zahlen"
        correct: true
      - en: "Book a meeting room for the team workshop"
        de: "Einen Besprechungsraum für den Team-Workshop buchen"
        correct: false
      - en: "Update the spreadsheet with the latest data"
        de: "Die Tabelle mit den neuesten Daten aktualisieren"
        correct: false
    explanation:
      en: "A goal describes a desired future state or result; the other options are pieces of work to do."
      de: "Ein Ziel beschreibt einen gewünschten künftigen Zustand oder ein Ergebnis; die anderen Optionen sind Arbeitsschritte."
    source: https://en.wikipedia.org/wiki/Goal_setting
  - id: pf-f-feedback
    level: foundation
    difficulty: 1000
    type: single
    stem:
      en: "Which feedback is specific, timely and focused on behaviour?"
      de: "Welches Feedback ist konkret, zeitnah und verhaltensbezogen?"
    options:
      - en: "\"You are careless, and this is not the first time that your work has been full of mistakes.\""
        de: "\"Du bist unsorgfältig, und das ist nicht das erste Mal, dass deine Arbeit voller Fehler ist.\""
        correct: false
      - en: "\"In today's meeting you gave the status only when asked. Please tell the team early about delays.\""
        de: "\"In der heutigen Besprechung hast du den Stand nur auf Nachfrage genannt. Bitte informiere das Team früh über Verzögerungen.\""
        correct: true
      - en: "\"Your attitude is a problem, as always, and everyone in the team has noticed it by now.\""
        de: "\"Deine Einstellung ist wie immer ein Problem, und das ist inzwischen allen im Team aufgefallen.\""
        correct: false
      - en: "\"We will talk about this at the end of the year, when all the points can be discussed together.\""
        de: "\"Darüber sprechen wir am Jahresende, wenn alle Punkte gemeinsam besprochen werden können.\""
        correct: false
    explanation:
      en: "Useful feedback names a concrete situation and observable behaviour, comes soon after, and says what is wanted. Judgments about character and long waits do not help."
      de: "Hilfreiches Feedback nennt eine konkrete Situation und beobachtbares Verhalten, kommt bald danach und sagt, was gewünscht ist. Charakterurteile und langes Warten helfen nicht."
    source: https://de.wikipedia.org/wiki/Feedback_(Gruppendynamik)
  - id: pf-f-fair
    level: foundation
    difficulty: 1050
    type: single
    stem:
      en: "Which practice supports a fair appraisal?"
      de: "Welche Praxis unterstützt eine faire Beurteilung?"
    options:
      - en: "Different criteria for each person, chosen after the fact to match the impression the manager has formed"
        de: "Für jede Person andere Kriterien, die nachträglich passend zum Eindruck der Führungskraft gewählt werden"
        correct: false
      - en: "Uniform, transparent criteria and a clearly defined scale for everyone"
        de: "Einheitliche, transparente Kriterien und eine klar definierte Skala für alle"
        correct: true
      - en: "Keeping the criteria secret from employees so that nobody can adapt their behaviour to the rating"
        de: "Die Kriterien vor den Beschäftigten geheim halten, damit niemand sein Verhalten auf die Bewertung ausrichtet"
        correct: false
      - en: "Judging only the most recent week, because it shows the current performance most accurately"
        de: "Nur die letzte Woche beurteilen, weil sie die aktuelle Leistung am genauesten zeigt"
        correct: false
    explanation:
      en: "Uniform and transparent criteria, a clear scale and the same standards for all make appraisals fairer and easier to accept."
      de: "Einheitliche, transparente Merkmale, ein klarer Maßstab und gleiche Maßstäbe für alle machen Beurteilungen fairer und besser akzeptierbar."
    source: https://de.wikipedia.org/wiki/Leistungsbeurteilung_(Personalwesen)
  - id: pf-p-smart
    level: practitioner
    difficulty: 1150
    type: single
    stem:
      en: "Which goal best meets SMART-style criteria?"
      de: "Welches Ziel erfüllt SMART-ähnliche Kriterien am besten?"
    options:
      - en: "Be better at reporting and show more commitment to the quality of the monthly figures"
        de: "Besser im Berichtswesen werden und mehr Engagement für die Qualität der Monatszahlen zeigen"
        correct: false
      - en: "Deliver the monthly report to finance by the agreed date in the next three cycles"
        de: "Den Monatsbericht in den nächsten drei Zyklen zum vereinbarten Termin an das Finanzwesen liefern"
        correct: true
      - en: "Try hard to improve over the coming year and show visible effort in all areas of the job"
        de: "Sich im kommenden Jahr sehr anstrengen und in allen Bereichen der Arbeit sichtbaren Einsatz zeigen"
        correct: false
      - en: "Do everything perfectly in every task of the department, without any mistakes at any time"
        de: "Jede Aufgabe der Abteilung perfekt erledigen, ohne zu irgendeinem Zeitpunkt Fehler zu machen"
        correct: false
    explanation:
      en: "The goal is specific, measurable, has an owner and a time frame; the others are vague. SMART is a checklist, not a guarantee."
      de: "Das Ziel ist konkret, messbar, hat eine verantwortliche Person und einen Zeitrahmen; die anderen sind vage. SMART ist eine Checkliste, keine Garantie."
    source: https://en.wikipedia.org/wiki/SMART_criteria
  - id: pf-p-cycle
    level: practitioner
    difficulty: 1220
    type: single
    stem:
      en: "Which order matches a typical goal-agreement cycle?"
      de: "Welche Reihenfolge entspricht einem typischen Zielvereinbarungsprozess?"
    options:
      - en: "Implementation, then agreement, then preparation"
        de: "Umsetzung, dann Vereinbarung, dann Vorbereitung"
        correct: false
      - en: "Preparation, agreement, implementation, target-actual comparison, then restart"
        de: "Vorbereitung, Vereinbarung, Umsetzung, Soll-Ist-Vergleich, danach erneuter Beginn"
        correct: true
      - en: "Target-actual comparison, then preparation, then nothing"
        de: "Soll-Ist-Vergleich, dann Vorbereitung, dann nichts mehr"
        correct: false
      - en: "Agreement only; no review is needed"
        de: "Nur Vereinbarung; eine Überprüfung ist nicht nötig"
        correct: false
    explanation:
      en: "The process runs from preparation and agreement through implementation to a target-actual comparison, and then begins again."
      de: "Der Prozess läuft von Vorbereitung und Vereinbarung über Umsetzung zum Soll-Ist-Vergleich und beginnt danach erneut."
    source: https://de.wikipedia.org/wiki/Zielvereinbarung
  - id: pf-p-sbi
    level: practitioner
    difficulty: 1300
    type: single
    stem:
      en: "A manager drafts: \"You were rude in the call.\" How do you coach them using situation, behaviour, impact?"
      de: "Eine Führungskraft formuliert: \"Du warst im Gespräch unhöflich.\" Wie coachst du sie mit Situation, Verhalten, Wirkung?"
    options:
      - en: "Keep the wording as it is, because it is short and clear, and the other person will understand it"
        de: "Die Formulierung beibehalten, weil sie kurz und klar ist und die andere Person sie verstehen wird"
        correct: false
      - en: "Name the call, describe what was said or done, explain the effect, then ask for the other person's view"
        de: "Den Anruf benennen, beschreiben, was gesagt oder getan wurde, die Wirkung erklären und nach der Sicht der anderen Person fragen"
        correct: true
      - en: "Add more adjectives about the person's character, so that the seriousness of the problem becomes clear"
        de: "Mehr Adjektive zum Charakter der Person ergänzen, damit der Ernst des Problems deutlich wird"
        correct: false
      - en: "Delay the feedback until the annual review, when the manager can address all behaviours together"
        de: "Das Feedback bis zum Jahresgespräch aufschieben, wenn die Führungskraft alle Verhaltensweisen gemeinsam ansprechen kann"
        correct: false
    explanation:
      en: "Situation, behaviour, impact is one common model: replace judgments with observable facts, state the effect and invite a response."
      de: "Situation, Verhalten, Wirkung ist ein verbreitetes Modell: Wertungen werden durch beobachtbare Fakten ersetzt, die Wirkung wird genannt und die Antwort eingeladen."
    source: https://de.wikipedia.org/wiki/Feedback_(Gruppendynamik)
  - id: pf-p-difficult
    level: practitioner
    difficulty: 1350
    type: single
    stem:
      en: "Which step helps most in a difficult feedback conversation?"
      de: "Welcher Schritt hilft in einem schwierigen Feedbackgespräch am meisten?"
    options:
      - en: "Prepare examples, state the purpose, listen, and agree a written next step with a follow-up date"
        de: "Beispiele vorbereiten, den Zweck nennen, zuhören und einen schriftlichen nächsten Schritt mit Nachfasstermin vereinbaren"
        correct: true
      - en: "Speak quickly and without pauses, so the other person cannot respond with objections or excuses"
        de: "Schnell und ohne Pausen sprechen, damit die andere Person nicht mit Einwänden oder Ausreden antworten kann"
        correct: false
      - en: "Avoid concrete examples to keep the atmosphere friendly and to prevent the person from feeling attacked"
        de: "Konkrete Beispiele vermeiden, damit die Stimmung freundlich bleibt und die Person sich nicht angegriffen fühlt"
        correct: false
      - en: "Record nothing at all, so that there is no later dispute about what was said or agreed in the room"
        de: "Nichts festhalten, damit es später keinen Streit darüber gibt, was im Raum gesagt oder vereinbart wurde"
        correct: false
    explanation:
      en: "Preparation with concrete examples, active listening and a clear next step make the conversation fair and useful; documenting agreements protects all parties."
      de: "Vorbereitung mit konkreten Beispielen, aktives Zuhören und ein klarer nächster Schritt machen das Gespräch fair und nützlich; die Dokumentation von Vereinbarungen schützt alle Beteiligten."
    source: https://en.wikipedia.org/wiki/Performance_appraisal
  - id: pf-a-bias
    level: advanced
    difficulty: 1450
    type: single
    stem:
      en: "A manager rates a strong performer highly on every criterion because of one outstanding project. Which bias is this?"
      de: "Eine Führungskraft bewertet eine leistungsstarke Person bei allen Kriterien hoch wegen eines herausragenden Projekts. Welcher Fehler ist das?"
    options:
      - en: "Halo effect"
        de: "Halo-Effekt"
        correct: true
      - en: "Central tendency"
        de: "Tendenz zur Mitte"
        correct: false
      - en: "Forced distribution"
        de: "Erzwungene Verteilung"
        correct: false
      - en: "Calibration"
        de: "Kalibrierung"
        correct: false
    explanation:
      en: "The halo effect describes one positive impression influencing the judgment of other areas. Central tendency means rating everyone in the middle."
      de: "Der Halo-Effekt beschreibt, dass ein positiver Eindruck die Beurteilung anderer Bereiche beeinflusst. Tendenz zur Mitte heißt, alle in der Mitte zu bewerten."
    source: https://en.wikipedia.org/wiki/Halo_effect
  - id: pf-a-reduce
    level: advanced
    difficulty: 1520
    type: single
    stem:
      en: "Which measure is a sensible practice for reducing rating bias?"
      de: "Welche Maßnahme ist eine sinnvolle Praxis, um Beurteilungsfehler zu verringern?"
    options:
      - en: "Let each manager use private criteria, because they know their own team and its work best"
        de: "Jede Führungskraft private Kriterien verwenden lassen, weil sie das eigene Team und dessen Arbeit am besten kennt"
        correct: false
      - en: "Ask for concrete evidence from the whole period and hold a calibration discussion on the same criteria"
        de: "Konkrete Belege aus dem gesamten Zeitraum verlangen und eine Kalibrierungsrunde anhand derselben Kriterien führen"
        correct: true
      - en: "Base ratings on the manager's memory of last week, because recent events are the most reliable"
        de: "Bewertungen auf die Erinnerung der Führungskraft an die letzte Woche stützen, weil jüngste Ereignisse am verlässlichsten sind"
        correct: false
      - en: "Remove all documentation, because written notes only add to the pressure and increase disputes"
        de: "Jede Dokumentation abschaffen, weil schriftliche Notizen nur den Druck erhöhen und Streit verstärken"
        correct: false
    explanation:
      en: "Evidence from the whole period, shared criteria and calibration are practice insights that reduce, but do not remove, bias such as recency."
      de: "Belege aus dem ganzen Zeitraum, gemeinsame Kriterien und Kalibrierung sind Praxiswissen, das Fehler wie den Rezenzeffekt verringert, aber nicht beseitigt."
    source: https://de.wikipedia.org/wiki/Beurteilungsfehler
  - id: pf-a-data
    level: advanced
    difficulty: 1580
    type: single
    stem:
      en: "You want to introduce a new tool that stores appraisal results. What is a sound first step?"
      de: "Du möchtest ein neues Tool einführen, das Beurteilungsergebnisse speichert. Was ist ein vernünftiger erster Schritt?"
    options:
      - en: "Upload all records right away and decide on access later, once the tool is running smoothly in daily use"
        de: "Alle Datensätze sofort hochladen und den Zugriff später festlegen, sobald das Tool im Alltag reibungslos läuft"
        correct: false
      - en: "Check with the DPO and company rules what is collected, who has access and how long it is kept"
        de: "Mit den Datenschutzbeauftragten und den betrieblichen Regeln klären, was erhoben wird, wer Zugriff hat und wie lange gespeichert wird"
        correct: true
      - en: "Give every employee access to all records, because transparency builds trust in the appraisal process"
        de: "Allen Beschäftigten Zugriff auf alle Datensätze geben, weil Transparenz Vertrauen in den Beurteilungsprozess schafft"
        correct: false
      - en: "Keep the tool secret from the works council until it has proved its value in a pilot with real data"
        de: "Das Tool vor dem Betriebsrat geheim halten, bis es sich in einer Pilotphase mit echten Daten bewährt hat"
        correct: false
    explanation:
      en: "Appraisal records are personal data. Check with the data protection officer and the applicable rules, including the works council where relevant, before collecting and storing them."
      de: "Beurteilungsunterlagen sind personenbezogene Daten. Klär vor Erhebung und Speicherung mit den Datenschutzbeauftragten und den geltenden Regeln, wo relevant auch mit dem Betriebsrat."
    source: https://de.wikipedia.org/wiki/Arbeitnehmerdatenschutz
  - id: pf-a-improve
    level: advanced
    difficulty: 1650
    type: single
    stem:
      en: "After an appraisal cycle, Team X gave everyone the same middle rating. What is the best response?"
      de: "Nach einem Beurteilungszyklus hat Team X allen dieselbe mittlere Bewertung gegeben. Was ist die beste Reaktion?"
    options:
      - en: "Accuse the manager of dishonesty in front of the other managers, so that the problem is addressed openly"
        de: "Der Führungskraft vor den anderen Führungskräften Unehrlichkeit vorwerfen, damit das Problem offen angesprochen wird"
        correct: false
      - en: "Treat it as a reason to ask questions: discuss concrete examples against shared criteria and note what to improve"
        de: "Als Anlass für Fragen nehmen: konkrete Beispiele anhand gemeinsamer Kriterien besprechen und Verbesserungen festhalten"
        correct: true
      - en: "Ignore it, because patterns in a single team never matter for the quality of the overall appraisal process"
        de: "Ignorieren, weil Muster in einem einzelnen Team für die Qualität des gesamten Beurteilungsprozesses nie eine Rolle spielen"
        correct: false
      - en: "Compare with an invented industry average, and tell the manager that the team deviates from that figure"
        de: "Mit einem erfundenen Branchendurchschnitt vergleichen und der Führungskraft sagen, dass das Team von dieser Zahl abweicht"
        correct: false
    explanation:
      en: "A pattern such as all-middle ratings (central tendency) is a prompt for questions, not proof of a mistake. Use evidence and shared criteria rather than invented benchmarks."
      de: "Ein Muster wie lauter mittlere Bewertungen (Tendenz zur Mitte) ist ein Anlass für Fragen, kein Beweis für einen Fehler. Nutze Belege und gemeinsame Kriterien statt erfundener Vergleichswerte."
    source: https://de.wikipedia.org/wiki/Beurteilungsfehler
