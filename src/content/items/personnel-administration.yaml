competency: personnel-administration
items:
  - id: pa-f-file
    level: foundation
    difficulty: 900
    type: single
    stem:
      en: "What best describes a personnel file?"
      de: "Was beschreibt eine Personalakte am besten?"
    options:
      - en: "A collection of documents, on paper or electronic, that the employer keeps about an employee and the employment relationship"
        de: "Eine Sammlung von Dokumenten, auf Papier oder elektronisch, die der Arbeitgeber über eine beschäftigte Person und das Arbeitsverhältnis führt"
        correct: true
      - en: "A public register of all employees that anyone inside or outside the company may read on request"
        de: "Ein öffentliches Register aller Beschäftigten, das jede Person innerhalb oder außerhalb des Unternehmens auf Anfrage einsehen darf"
        correct: false
      - en: "Only the payslips of a person, kept so that payroll can show what was paid in each month"
        de: "Nur die Gehaltsabrechnungen einer Person, die belegen, was in welchem Monat gezahlt wurde"
        correct: false
      - en: "A private diary kept by the line manager with personal impressions that HR never sees or files"
        de: "Ein privates Tagebuch der Führungskraft mit persönlichen Eindrücken, das HR nie sieht oder ablegt"
        correct: false
    explanation:
      en: "The article describes it as a collection of documents about the person and the employment relationship, kept on paper or electronically."
      de: "Der Artikel beschreibt sie als Sammlung von Schriftstücken zur Person und zum Arbeitsverhältnis, auf Papier oder elektronisch."
    source: https://de.wikipedia.org/wiki/Personalakte
  - id: pa-f-lifecycle
    level: foundation
    difficulty: 950
    type: single
    stem:
      en: "Which principle should guide what happens when an employee's role changes?"
      de: "Welcher Grundsatz sollte leiten, was bei einem Rollenwechsel geschieht?"
    options:
      - en: "Every data change should have a document behind it, filed with the right person"
        de: "Hinter jeder Datenänderung sollte ein Dokument stehen, das der richtigen Person zugeordnet abgelegt wird"
        correct: true
      - en: "Change the system entry first and look for a document later, if the change is ever questioned"
        de: "Zuerst den Systemeintrag ändern und erst später ein Dokument suchen, falls die Änderung hinterfragt wird"
        correct: false
      - en: "Delete the old documents so that the file stays short and only the current situation is visible"
        de: "Die alten Dokumente löschen, damit die Akte kurz bleibt und nur der aktuelle Stand sichtbar ist"
        correct: false
      - en: "Tell the whole team about the change by email so that everybody can update their own records"
        de: "Das ganze Team per E-Mail über die Änderung informieren, damit alle ihre eigenen Unterlagen aktualisieren"
        correct: false
    explanation:
      en: "The file should give a complete, truthful and careful picture of the employment, so changes are backed by documents rather than overwritten or undocumented."
      de: "Die Akte soll ein vollständiges, wahrheitsgemäßes und sorgfältiges Bild des Beschäftigungsverhältnisses geben; Änderungen werden daher belegt und nicht überschrieben oder undokumentiert gelassen."
    source: https://de.wikipedia.org/wiki/Personalakte
  - id: pa-f-confidential
    level: foundation
    difficulty: 1000
    type: single
    stem:
      en: "A colleague from another department asks to see a person's personnel file out of curiosity. What is the right response?"
      de: "Eine Kollegin aus einer anderen Abteilung möchte aus Neugier die Personalakte einer Person sehen. Was ist die richtige Reaktion?"
    options:
      - en: "Decline: personnel files are confidential and access is limited to those who handle them and the supervisors"
        de: "Ablehnen: Personalakten sind vertraulich, der Zugang beschränkt sich auf die damit befassten Personen und Vorgesetzte"
        correct: true
      - en: "Allow it if she promises not to tell anyone, because the curiosity is harmless and the colleague is trusted"
        de: "Erlauben, wenn sie verspricht, niemandem etwas zu sagen, weil die Neugier harmlos und die Kollegin vertrauenswürdig ist"
        correct: false
      - en: "Send her a scan so she can read it at her desk, since the colleague works for the same company"
        de: "Ihr einen Scan schicken, damit sie ihn am Schreibtisch lesen kann, da sie im selben Unternehmen arbeitet"
        correct: false
      - en: "Show her only the pages that look harmless, such as the training certificates and the job title"
        de: "Ihr nur die harmlos wirkenden Seiten zeigen, etwa Schulungsnachweise und die Stellenbezeichnung"
        correct: false
    explanation:
      en: "The article says personnel files are to be treated as strictly confidential and secured against unauthorised access."
      de: "Der Artikel sagt, Personalakten seien strikt vertraulich zu behandeln und gegen unbefugte Einsicht zu sichern."
    source: https://de.wikipedia.org/wiki/Personalakte
  - id: pa-f-absence
    level: foundation
    difficulty: 1050
    type: single
    stem:
      en: "Why should an absence be recorded with the correct type, such as holiday, sick leave or unpaid leave?"
      de: "Warum sollte eine Abwesenheit mit der richtigen Art erfasst werden, etwa Urlaub, Krankheit oder unbezahlte Freistellung?"
    options:
      - en: "Because there are different kinds of leave and the type decides which rules apply next"
        de: "Weil es verschiedene Arten von Abwesenheit gibt und die Art entscheidet, welche Regeln als Nächstes gelten"
        correct: true
      - en: "Because all types of absence are handled in exactly the same way by payroll, so the label is only for tidiness"
        de: "Weil alle Abwesenheitsarten von der Entgeltabrechnung gleich behandelt werden und die Bezeichnung nur der Ordnung dient"
        correct: false
      - en: "Because the type only matters for the team calendar colours and has no effect on any process"
        de: "Weil die Art nur für die Farben im Teamkalender zählt und keinen Einfluss auf Abläufe hat"
        correct: false
      - en: "Because HR staff can then calculate the pay from the type alone, without looking at any further data"
        de: "Weil HR-Mitarbeitende dann allein aus der Art das Entgelt berechnen können, ohne weitere Daten anzusehen"
        correct: false
    explanation:
      en: "The article describes subcategories of leave and notes that rules vary by country and are set by law, contracts or agreements, so the recorded type drives what happens next."
      de: "Der Artikel beschreibt Unterarten der Freistellung und weist darauf hin, dass Regeln je nach Land durch Gesetz, Verträge oder Vereinbarungen festgelegt werden; die erfasste Art steuert daher das Weitere."
    source: https://en.wikipedia.org/wiki/Leave_of_absence
  - id: pa-p-change
    level: practitioner
    difficulty: 1150
    type: single
    stem:
      en: "Which sequence is the most reliable for processing a contract change?"
      de: "Welche Reihenfolge ist für die Bearbeitung einer Vertragsänderung am verlässlichsten?"
    options:
      - en: "Check the written agreement, update master data, file the document, verify the entry, inform payroll"
        de: "Die schriftliche Vereinbarung prüfen, Stammdaten aktualisieren, Dokument ablegen, Eintrag kontrollieren, Entgeltabrechnung informieren"
        correct: true
      - en: "Update the system from a verbal request and file the paperwork later if somebody asks for it"
        de: "Das System nach mündlicher Bitte aktualisieren und die Unterlagen später ablegen, falls jemand danach fragt"
        correct: false
      - en: "Overwrite the old contract document with the new one so that only one current version exists in the file"
        de: "Das alte Vertragsdokument mit dem neuen überschreiben, damit nur eine aktuelle Version in der Akte liegt"
        correct: false
      - en: "Inform payroll first and update the master data at month end together with all other changes"
        de: "Zuerst die Entgeltabrechnung informieren und die Stammdaten zum Monatsende gemeinsam mit allen anderen Änderungen aktualisieren"
        correct: false
    explanation:
      en: "A documented, repeatable routine keeps system and file consistent; the file should show a complete, truthful picture, so history is added to, not overwritten."
      de: "Eine dokumentierte, wiederholbare Routine hält System und Akte konsistent; die Akte soll ein vollständiges, wahrheitsgemäßes Bild zeigen, daher wird die Historie ergänzt und nicht überschrieben."
    source: https://de.wikipedia.org/wiki/Personalakte
  - id: pa-p-calendar
    level: practitioner
    difficulty: 1220
    type: single
    stem:
      en: "What should a shared team calendar show about an employee's sick absence?"
      de: "Was sollte ein gemeinsamer Teamkalender über die krankheitsbedingte Abwesenheit einer Person zeigen?"
    options:
      - en: "Only that the person is absent, without the reason"
        de: "Nur, dass die Person abwesend ist, ohne den Grund"
        correct: true
      - en: "The diagnosis, so colleagues can plan around it"
        de: "Die Diagnose, damit Kolleginnen und Kollegen planen können"
        correct: false
      - en: "The reason in a short code that insiders understand"
        de: "Den Grund in einem Kürzel, das Eingeweihte verstehen"
        correct: false
      - en: "A list of all earlier absences of that person"
        de: "Eine Liste aller früheren Abwesenheiten dieser Person"
        correct: false
    explanation:
      en: "The article notes that lists of illness reasons do not belong in the personnel file; a team view needs only the information that the person is absent."
      de: "Der Artikel nennt, dass Listen mit Krankheitsgründen nicht in die Personalakte gehören; eine Teamansicht braucht nur die Information, dass die Person abwesend ist."
    source: https://de.wikipedia.org/wiki/Personalakte
  - id: pa-p-time
    level: practitioner
    difficulty: 1280
    type: single
    stem:
      en: "A manager asks you to use time-recording data to rank employees by productivity (Germany). What is the best response?"
      de: "Eine Führungskraft bittet dich, Zeiterfassungsdaten zu nutzen, um Beschäftigte nach Produktivität zu ordnen (Deutschland). Was ist die beste Reaktion?"
    options:
      - en: "Clarify the purpose and involve the DPO and the works council before any evaluation"
        de: "Zweck klären und vor jeder Auswertung Datenschutzbeauftragte und Betriebsrat einbeziehen"
        correct: true
      - en: "Do it, because the company already holds the time data lawfully and may therefore use it for any purpose"
        de: "Durchführen, weil das Unternehmen die Zeitdaten rechtmäßig besitzt und sie daher für jeden Zweck nutzen darf"
        correct: false
      - en: "Do it, but share the ranking only with the manager so that colleagues cannot compare themselves"
        de: "Durchführen, aber das Ranking nur mit der Führungskraft teilen, damit Kolleginnen und Kollegen sich nicht vergleichen"
        correct: false
      - en: "Do it after removing the names from the list and pass the anonymous ranking on to the manager"
        de: "Nach dem Entfernen der Namen durchführen und das anonyme Ranking an die Führungskraft weitergeben"
        correct: false
    explanation:
      en: "Using time data for a new purpose such as performance comparison is a change of purpose with data-protection and, in Germany, works-council implications. Lawfully holding the data does not cover a new use, and a ranking meant to judge individuals cannot simply be anonymised. HR does not decide whether it is allowed: the DPO, the works council and legal counsel do."
      de: "Zeitdaten für einen neuen Zweck wie einen Leistungsvergleich zu nutzen, ist eine Zweckänderung mit Folgen für den Datenschutz und, in Deutschland, für die Mitbestimmung des Betriebsrats. Dass die Daten rechtmäßig erfasst werden, deckt keine neue Nutzung, und ein Ranking zur Beurteilung einzelner Personen lässt sich nicht einfach anonymisieren. Ob es zulässig ist, entscheidet nicht HR, sondern Datenschutzbeauftragte, Betriebsrat und Rechtsberatung."
    source: https://de.wikipedia.org/wiki/Zeiterfassung
  - id: pa-p-reference
    level: practitioner
    difficulty: 1350
    type: single
    stem:
      en: "Which statement about the employment reference (Arbeitszeugnis) matches the cited article?"
      de: "Welche Aussage zum Arbeitszeugnis passt zum zitierten Artikel?"
    options:
      - en: "A simple reference covers type and duration of work, a qualified one also covers performance and conduct; clarity and truthfulness apply"
        de: "Ein einfaches Zeugnis nennt Art und Dauer der Tätigkeit, ein qualifiziertes auch Leistung und Verhalten; Klarheit und Wahrheit gelten als Grundsätze"
        correct: true
      - en: "It must always be written in a secret code so that only HR specialists and other employers can understand it"
        de: "Es muss stets in einem Geheimcode verfasst sein, den nur HR-Fachleute und andere Arbeitgeber verstehen"
        correct: false
      - en: "HR staff alone decide on any disputed wording without involving the manager who knows the work"
        de: "Die HR-Mitarbeitenden entscheiden allein über strittige Formulierungen, ohne die Führungskraft einzubeziehen, die die Arbeit kennt"
        correct: false
      - en: "It contains only the employee's salary history and the dates of promotions during the employment"
        de: "Es enthält nur die Gehaltsentwicklung der beschäftigten Person und die Zeitpunkte von Beförderungen"
        correct: false
    explanation:
      en: "The article distinguishes simple and qualified references and names clarity, truthfulness, completeness and goodwill as principles; ambiguous formulations that criticise the employee are not acceptable."
      de: "Der Artikel unterscheidet einfache und qualifizierte Zeugnisse und nennt Klarheit, Wahrheit, Vollständigkeit und Wohlwollen als Grundsätze; doppeldeutige Formulierungen, die die Person kritisieren, sind nicht zulässig."
    source: https://de.wikipedia.org/wiki/Arbeitszeugnis
  - id: pa-a-retention
    level: advanced
    difficulty: 1450
    type: single
    stem:
      en: "What is the best way to build a retention table for personnel documents?"
      de: "Wie baut man am besten eine Aufbewahrungstabelle für Personalunterlagen auf?"
    options:
      - en: "List each document type with its reason, the confirmed rule, an owner and a logged deletion step"
        de: "Jede Dokumentenart mit Grund, bestätigter Regel, Verantwortlichem und protokolliertem Löschschritt aufführen"
        correct: true
      - en: "Use one standard period from memory for every document type, because a single rule is easier to apply and audit"
        de: "Eine Standardfrist aus dem Gedächtnis für alle Dokumentenarten verwenden, weil eine einzige Regel leichter anzuwenden und zu prüfen ist"
        correct: false
      - en: "Keep everything for ever to be on the safe side, because documents might be needed in a later dispute"
        de: "Alles für immer aufbewahren, um auf der sicheren Seite zu sein, da Dokumente in einem späteren Streit gebraucht werden könnten"
        correct: false
      - en: "Delete everything on the last day of employment so that no personal data remains in the company at all"
        de: "Alles am letzten Arbeitstag löschen, damit überhaupt keine personenbezogenen Daten im Unternehmen verbleiben"
        correct: false
    explanation:
      en: "The sources say retention rules differ by field and document and that completed matters can regain relevance while limitation periods run, so each document type needs its own confirmed rule."
      de: "Die Quellen sagen, dass Aufbewahrungsregeln je nach Bereich und Dokument verschieden sind und abgeschlossene Vorgänge erneut Bedeutung erlangen können, solange Verjährungsfristen laufen; jede Dokumentart braucht daher eine eigene bestätigte Regel."
    source: https://de.wikipedia.org/wiki/Aufbewahrungsfrist
  - id: pa-a-access
    level: advanced
    difficulty: 1520
    type: single
    stem:
      en: "Which design best applies the principle of least privilege to HR data?"
      de: "Welche Gestaltung wendet das Prinzip der geringsten Berechtigung auf HR-Daten am besten an?"
    options:
      - en: "Roles that give each person only the data needed for their tasks, reviewed as duties change"
        de: "Rollen, die jeder Person nur die für ihre Aufgaben nötigen Daten geben und bei Aufgabenwechsel geprüft werden"
        correct: true
      - en: "Full access for every HR team member, to keep things simple and avoid delays when a colleague is absent"
        de: "Vollzugriff für alle im HR-Team, um es einfach zu halten und Verzögerungen bei Abwesenheit zu vermeiden"
        correct: false
      - en: "Shared logins for the whole team so that nobody is singled out and anybody can cover for a colleague"
        de: "Gemeinsame Zugänge für das ganze Team, damit niemand herausgehoben wird und alle Kolleginnen und Kollegen vertreten können"
        correct: false
      - en: "Access for everyone in the company who asks politely and explains that they need the data for their work"
        de: "Zugriff für alle im Unternehmen, die höflich fragen und erklären, dass sie die Daten für ihre Arbeit brauchen"
        correct: false
    explanation:
      en: "The access control article describes authorising people only for what they need for their jobs and nothing more; the Personalakte article limits access to those who handle the documents and the supervisors."
      de: "Der Artikel zu Access control beschreibt, Menschen nur für das zu berechtigen, was sie für ihre Aufgaben brauchen; der Artikel zur Personalakte beschränkt den Zugang auf die Bearbeitenden und die Vorgesetzten."
    source: https://en.wikipedia.org/wiki/Access_control
  - id: pa-a-correction
    level: advanced
    difficulty: 1580
    type: single
    stem:
      en: "An employee says an entry in their file is wrong. What is the best handling at concept level?"
      de: "Eine beschäftigte Person sagt, ein Eintrag in ihrer Akte sei falsch. Was ist auf Konzeptebene die beste Vorgehensweise?"
    options:
      - en: "Log the request, route it per procedure, correct only what is demonstrably wrong and keep a trace"
        de: "Den Antrag protokollieren, gemäß Verfahren weiterleiten, nur nachweislich Falsches korrigieren und eine Spur behalten"
        correct: true
      - en: "Quietly remove the document from the file so that the problem disappears without a discussion"
        de: "Das Dokument still aus der Akte entfernen, damit das Problem ohne Diskussion verschwindet"
        correct: false
      - en: "Refuse any change, because the file is the employer's property and the employer decides what it contains"
        de: "Jede Änderung ablehnen, weil die Akte Eigentum des Arbeitgebers ist und er entscheidet, was sie enthält"
        correct: false
      - en: "Promise a correction within a fixed number of days straight away, before checking whether the entry is wrong"
        de: "Sofort eine Korrektur innerhalb einer festen Zahl von Tagen zusagen, noch bevor geprüft ist, ob der Eintrag falsch ist"
        correct: false
    explanation:
      en: "The article describes inspection rights, counter-statements and the possibility of removing unjustified entries; deciding what applies is a matter for the DPO or legal counsel, and informal removal would be improper."
      de: "Der Artikel beschreibt Einsichtsrecht, Gegendarstellung und die Möglichkeit, unberechtigte Einträge zu entfernen; was gilt, entscheiden Datenschutzbeauftragte oder Rechtsberatung, und informelles Entfernen wäre falsch."
    source: https://de.wikipedia.org/wiki/Personalakte
  - id: pa-a-reconcile
    level: advanced
    difficulty: 1650
    type: single
    stem:
      en: "HR headcount and the data passed to payroll differ for one person. What is the best approach?"
      de: "Die Personenzahl im HR-System und die an die Entgeltabrechnung übergebenen Daten weichen bei einer Person ab. Was ist die beste Vorgehensweise?"
    options:
      - en: "Trace the difference to its source, correct the master data there with a note, inform payroll and finance, add a validation rule"
        de: "Die Abweichung bis zur Quelle verfolgen, dort die Stammdaten mit Vermerk korrigieren, Entgeltabrechnung und Finanzen informieren, eine Validierungsregel ergänzen"
        correct: true
      - en: "Adjust the payroll figure so that it matches and leave the HR record as it is, because payroll is checked more closely"
        de: "Die Abrechnungszahl anpassen, bis sie passt, und den HR-Datensatz unverändert lassen, weil die Abrechnung genauer geprüft wird"
        correct: false
      - en: "Wait until the next audit and hope the difference disappears or is explained by the auditors themselves"
        de: "Bis zur nächsten Prüfung warten und hoffen, dass die Abweichung verschwindet oder von den Prüfenden erklärt wird"
        correct: false
      - en: "Delete the person's record in both systems and create it again so that both start from a clean state"
        de: "Den Datensatz der Person in beiden Systemen löschen und neu anlegen, damit beide sauber neu beginnen"
        correct: false
    explanation:
      en: "Master data, payroll and time data belong to one data basis, so differences are fixed at the source and the fix is recorded; patching one downstream system leaves the cause in place."
      de: "Stammdaten, Abrechnungs- und Zeitdaten gehören zu einer gemeinsamen Datenbasis; Abweichungen werden an der Quelle behoben und festgehalten, ein Flicken im nachgelagerten System lässt die Ursache bestehen."
    source: https://de.wikipedia.org/wiki/Personalinformationssystem
