competency: employee-relations-conflict
items:
  - id: erc-f-meaning
    level: foundation
    difficulty: 900
    type: single
    stem:
      en: "What best describes a workplace conflict?"
      de: "Was beschreibt einen Konflikt am Arbeitsplatz am besten?"
    options:
      - en: "Discord caused by opposing needs, values or interests that affects work"
        de: "Uneinigkeit durch gegensätzliche Bedürfnisse, Werte oder Interessen, die sich auf die Arbeit auswirkt"
        correct: true
      - en: "Any difference of opinion between colleagues, however small and however quickly it is settled"
        de: "Jede Meinungsverschiedenheit zwischen Kolleginnen und Kollegen, wie klein sie auch ist und wie schnell sie beigelegt wird"
        correct: false
      - en: "A planned team workshop in which colleagues discuss their roles and responsibilities openly"
        de: "Ein geplanter Team-Workshop, in dem Kolleginnen und Kollegen offen über Rollen und Verantwortlichkeiten sprechen"
        correct: false
      - en: "A dispute about a fixed salary only, which is settled between the employee and payroll"
        de: "Ausschließlich ein Streit über ein festes Gehalt, der zwischen der beschäftigten Person und der Entgeltabrechnung geklärt wird"
        correct: false
    explanation:
      en: "A conflict arises from actual or perceived opposition of needs, values or interests and affects work or relations."
      de: "Ein Konflikt entsteht aus tatsächlich oder vermeintlich gegensätzlichen Bedürfnissen, Werten oder Interessen und berührt Arbeit oder Beziehungen."
    source: https://en.wikipedia.org/wiki/Workplace_conflict
  - id: erc-f-fact
    level: foundation
    difficulty: 950
    type: single
    stem:
      en: "Which statement is a fact rather than a judgement?"
      de: "Welche Aussage ist ein Fakt und kein Urteil?"
    options:
      - en: "\"The report arrived two days after the agreed date.\""
        de: "\"Der Bericht kam zwei Tage nach dem vereinbarten Termin an.\""
        correct: true
      - en: "\"He is lazy, and everyone in the team knows that he never really tries.\""
        de: "\"Er ist faul, und alle im Team wissen, dass er sich nie wirklich anstrengt.\""
        correct: false
      - en: "\"She never cares about the deadlines of the others in the team.\""
        de: "\"Ihr sind die Termine der anderen im Team nie wichtig.\""
        correct: false
      - en: "\"They are impossible to work with, and that has been obvious since the start.\""
        de: "\"Mit ihnen ist es unmöglich zusammenzuarbeiten, das war von Anfang an klar.\""
        correct: false
    explanation:
      en: "Observable, verifiable statements are facts. Labels about a person are judgements and escalate conflicts."
      de: "Beobachtbare, überprüfbare Aussagen sind Fakten. Zuschreibungen über eine Person sind Urteile und verschärfen Konflikte."
    source: https://en.wikipedia.org/wiki/Workplace_conflict
  - id: erc-f-listening
    level: foundation
    difficulty: 1000
    type: single
    stem:
      en: "Which is an example of active listening?"
      de: "Was ist ein Beispiel für aktives Zuhören?"
    options:
      - en: "Paraphrasing: \"So you feel the tasks were reassigned without asking you?\""
        de: "Paraphrasieren: \"Du hast also das Gefühl, dass die Aufgaben neu verteilt wurden, ohne dich zu fragen?\""
        correct: true
      - en: "Interrupting early to give your own solution, so that the person does not need to explain everything"
        de: "Früh unterbrechen und die eigene Lösung nennen, damit die Person nicht alles erklären muss"
        correct: false
      - en: "Checking your phone while the person speaks, so that you can handle urgent messages at the same time"
        de: "Während die Person spricht aufs Handy schauen, um dringende Nachrichten gleichzeitig zu bearbeiten"
        correct: false
      - en: "Telling the person to calm down and not to take the matter so seriously before they finish their account"
        de: "Der Person sagen, sie solle sich beruhigen und die Sache nicht so ernst nehmen, noch bevor sie ihre Schilderung beendet hat"
        correct: false
    explanation:
      en: "Active listening means giving full attention and showing understanding, for example by paraphrasing."
      de: "Aktives Zuhören heißt, volle Aufmerksamkeit zu geben und Verständnis zu zeigen, zum Beispiel durch Zusammenfassen."
    source: https://en.wikipedia.org/wiki/Active_listening
  - id: erc-f-escalate
    level: foundation
    difficulty: 1050
    type: single
    stem:
      en: "An employee tells you in confidence about harassment by a colleague. What do you do?"
      de: "Eine Mitarbeitende erzählt dir vertraulich von Belästigung durch einen Kollegen. Was tust du?"
    options:
      - en: "Listen, note facts and involve the responsible person; do not promise absolute secrecy"
        de: "Zuhören, Fakten notieren und die zuständige Stelle einbinden; keine absolute Verschwiegenheit zusagen"
        correct: true
      - en: "Promise absolute secrecy and do nothing further, so that the employee keeps trust in the conversation"
        de: "Absolute Verschwiegenheit zusagen und nichts weiter tun, damit die beschäftigte Person ihr Vertrauen in das Gespräch behält"
        correct: false
      - en: "Confront the colleague alone and punish him at once, so that the behaviour stops without a long process"
        de: "Den Kollegen allein zur Rede stellen und sofort bestrafen, damit das Verhalten ohne langes Verfahren aufhört"
        correct: false
      - en: "Tell the whole team to be careful with their behaviour, without naming the person or the incident"
        de: "Dem ganzen Team sagen, es solle auf sein Verhalten achten, ohne die Person oder den Vorfall zu nennen"
        correct: false
    explanation:
      en: "Serious matters such as harassment need the responsible person or procedure. You cannot promise secrecy that conflicts with duties to act."
      de: "Ernste Themen wie Belästigung gehören in die zuständige Stelle oder das zuständige Verfahren. Du kannst keine Verschwiegenheit zusagen, die Handlungspflichten widerspricht."
    source: https://en.wikipedia.org/wiki/Workplace_conflict
  - id: erc-p-steps
    level: practitioner
    difficulty: 1150
    type: single
    stem:
      en: "Which is a sensible first step when an employee files a complaint?"
      de: "Was ist ein sinnvoller erster Schritt, wenn eine Mitarbeitende eine Beschwerde einreicht?"
    options:
      - en: "Acknowledge it and explain next steps and timeline"
        de: "Den Eingang bestätigen und die nächsten Schritte samt Zeitplan erklären"
        correct: true
      - en: "Decide the outcome immediately, so that the person knows quickly what will happen with the complaint"
        de: "Das Ergebnis sofort entscheiden, damit die Person schnell weiß, was mit der Beschwerde geschieht"
        correct: false
      - en: "Ignore it until the person asks again, which shows whether the matter is really important to them"
        de: "Sie ignorieren, bis die Person nachfragt, was zeigt, ob ihr die Sache wirklich wichtig ist"
        correct: false
      - en: "Share it with the whole department, so that all colleagues can give their view on the matter"
        de: "Sie mit der ganzen Abteilung teilen, damit alle Kolleginnen und Kollegen ihre Sicht dazu äußern können"
        correct: false
    explanation:
      en: "A fair procedure starts by acknowledging the complaint and making next steps clear."
      de: "Ein faires Verfahren beginnt damit, den Eingang zu bestätigen und die nächsten Schritte klar zu machen."
    source: https://en.wikipedia.org/wiki/Grievance_(labour)
  - id: erc-p-mediation
    level: practitioner
    difficulty: 1200
    type: single
    stem:
      en: "What is the role of a mediator?"
      de: "Welche Rolle hat eine Mediatorin oder ein Mediator?"
    options:
      - en: "A neutral person who helps the parties find their own agreement"
        de: "Eine neutrale Person, die den Parteien hilft, selbst eine Einigung zu finden"
        correct: true
      - en: "A judge who listens to both sides and decides who is right and who is wrong in the dispute"
        de: "Eine Richterin oder ein Richter, die oder der beide Seiten anhört und entscheidet, wer im Streit recht hat"
        correct: false
      - en: "The advocate of the weaker party, who argues for that party's interests during the sessions"
        de: "Die Fürsprecherin oder der Fürsprecher der schwächeren Partei, die oder der deren Interessen in den Sitzungen vertritt"
        correct: false
      - en: "The manager of one of the parties, who knows the background of the dispute from daily work"
        de: "Die Führungskraft einer der Parteien, die den Hintergrund des Streits aus der täglichen Arbeit kennt"
        correct: false
    explanation:
      en: "A mediator facilitates the process but does not decide the outcome; participation is generally voluntary."
      de: "Die Mediation unterstützt den Prozess, entscheidet aber nicht über das Ergebnis; die Teilnahme ist grundsätzlich freiwillig."
    source: https://en.wikipedia.org/wiki/Mediation
  - id: erc-p-question
    level: practitioner
    difficulty: 1250
    type: single
    stem:
      en: "Which question is the best open, non-leading question in a fact-finding talk?"
      de: "Welche Frage ist in einem Klärungsgespräch die beste offene, nicht suggestive Frage?"
    options:
      - en: "\"What happened in the meeting?\""
        de: "\"Was ist in der Besprechung passiert?\""
        correct: true
      - en: "\"He shouted at you, didn't he?\""
        de: "\"Er hat dich angeschrien, oder?\""
        correct: false
      - en: "\"You agree that she was unfair, right?\""
        de: "\"Du stimmst zu, dass sie unfair war, oder?\""
        correct: false
      - en: "\"Why are you always complaining?\""
        de: "\"Warum beschwerst du dich ständig?\""
        correct: false
    explanation:
      en: "Open questions invite the person's own account. Leading questions push the answer and weaken a fair fact-finding."
      de: "Offene Fragen laden zur eigenen Schilderung ein. Suggestivfragen lenken die Antwort und schwächen eine faire Klärung."
    source: https://en.wikipedia.org/wiki/Grievance_(labour)
  - id: erc-p-unsuitable
    level: practitioner
    difficulty: 1350
    type: single
    stem:
      en: "In which case is mediation usually unsuitable?"
      de: "In welchem Fall ist Mediation in der Regel ungeeignet?"
    options:
      - en: "Threats or violence by one party against the other"
        de: "Drohungen oder Gewalt einer Seite gegen die andere"
        correct: true
      - en: "Disagreement about how to split a shared task"
        de: "Uneinigkeit über die Aufteilung einer gemeinsamen Aufgabe"
        correct: false
      - en: "Poor communication between two colleagues"
        de: "Schlechte Kommunikation zwischen zwei Kollegen"
        correct: false
      - en: "Different working styles in a team"
        de: "Unterschiedliche Arbeitsstile in einem Team"
        correct: false
    explanation:
      en: "Mediation works for relationship and communication issues between roughly equal parties; threats, violence or violations need other, formal handling."
      de: "Mediation hilft bei Beziehungs- und Kommunikationsthemen zwischen etwa gleichstarken Beteiligten; Drohungen, Gewalt oder Verstöße brauchen andere, formale Bearbeitung."
    source: https://en.wikipedia.org/wiki/Mediation
  - id: erc-a-staged
    level: advanced
    difficulty: 1450
    type: single
    stem:
      en: "Why should a staged conflict system include a way to bypass a stage?"
      de: "Warum sollte ein gestuftes Konfliktsystem einen Weg zum Überspringen einer Stufe enthalten?"
    options:
      - en: "The manager may be involved or the matter may be serious"
        de: "Die Führungskraft kann beteiligt sein oder der Fall kann schwerwiegend sein"
        correct: true
      - en: "To make the process shorter for every case, so that cases are always settled at the highest level"
        de: "Um den Prozess für jeden Fall zu verkürzen, damit Fälle immer auf der höchsten Ebene entschieden werden"
        correct: false
      - en: "To avoid documenting cases, because documentation is only needed when all stages are completed"
        de: "Um die Dokumentation von Fällen zu vermeiden, weil sie nur nötig ist, wenn alle Stufen durchlaufen wurden"
        correct: false
      - en: "To keep employees from using it, because a complicated system discourages most complaints"
        de: "Um Beschäftigte von der Nutzung abzuhalten, weil ein kompliziertes System die meisten Beschwerden verhindert"
        correct: false
    explanation:
      en: "If the first contact is part of the problem or the issue is serious, people need another route to reach HR or a complaints office."
      de: "Ist die erste Anlaufstelle Teil des Problems oder die Sache ernst, brauchen Menschen einen anderen Weg zur Personalabteilung oder Beschwerdestelle."
    source: https://de.wikipedia.org/wiki/Konfliktmanagement
  - id: erc-a-works
    level: advanced
    difficulty: 1500
    type: single
    stem:
      en: "What is the general role of a works council compared with HR?"
      de: "Was ist die allgemeine Rolle eines Betriebsrats im Vergleich zur Personalabteilung?"
    options:
      - en: "It represents employees; HR represents the employer"
        de: "Er vertritt die Beschäftigten; HR vertritt den Arbeitgeber"
        correct: true
      - en: "It is a department of HR that supports the managers in the personnel planning of the company"
        de: "Er ist eine Abteilung des HR, die Führungskräfte bei der Personalplanung des Unternehmens unterstützt"
        correct: false
      - en: "It replaces all managers in decisions that concern working hours and the organisation of work"
        de: "Er ersetzt alle Führungskräfte bei Entscheidungen zu Arbeitszeit und Arbeitsorganisation"
        correct: false
      - en: "It decides on all dismissals alone, without the employer having a say in the outcome of the case"
        de: "Er entscheidet allein über alle Kündigungen, ohne dass der Arbeitgeber bei dem Ergebnis mitreden kann"
        correct: false
    explanation:
      en: "Works councils represent employees in a workplace. Clear roles on both sides support constructive cooperation."
      de: "Betriebsräte vertreten Beschäftigte im Betrieb. Klare Rollen auf beiden Seiten unterstützen konstruktive Zusammenarbeit."
    source: https://en.wikipedia.org/wiki/Works_council
  - id: erc-a-allegation
    level: advanced
    difficulty: 1550
    type: single
    stem:
      en: "A report alleges discrimination. Which approach fits best?"
      de: "Eine Meldung wirft Diskriminierung vor. Welcher Ansatz passt am besten?"
    options:
      - en: "Use a formal procedure with legal advice; the employer must act, so do not leave it to voluntary mediation alone"
        de: "Ein formales Verfahren mit Rechtsberatung nutzen; der Arbeitgeber muss handeln, daher nicht allein der freiwilligen Mediation überlassen"
        correct: true
      - en: "Ask both sides to mediate and close the case"
        de: "Beide Seiten zur Mediation bitten und den Fall schließen"
        correct: false
      - en: "Wait to see whether it happens again"
        de: "Abwarten, ob es noch einmal passiert"
        correct: false
      - en: "Move the reporting person to another team without asking"
        de: "Die meldende Person ohne Rückfrage in ein anderes Team versetzen"
        correct: false
    explanation:
      en: "Serious allegations create duties for the employer. Mediation can supplement but not replace proper handling; moving the reporter unasked risks retaliation."
      de: "Ernste Vorwürfe lösen Pflichten des Arbeitgebers aus. Mediation kann ergänzen, aber nicht ordentliche Bearbeitung ersetzen; ein ungefragtes Versetzen der meldenden Person birgt das Risiko einer Benachteiligung."
    source: https://en.wikipedia.org/wiki/Employee_relations
  - id: erc-a-pattern
    level: advanced
    difficulty: 1650
    type: single
    stem:
      en: "Three complaints concern the same area. How do you use this pattern appropriately?"
      de: "Drei Beschwerden betreffen denselben Bereich. Wie nutzt du dieses Muster angemessen?"
    options:
      - en: "Analyse it in anonymised form for causes and prevention, not to expose individuals"
        de: "In anonymisierter Form auf Ursachen und Vorbeugung analysieren, nicht um Einzelne bloßzustellen"
        correct: true
      - en: "Publish the names of all complainants so that the department understands where the problem comes from"
        de: "Die Namen aller Beschwerdeführenden veröffentlichen, damit die Abteilung versteht, woher das Problem kommt"
        correct: false
      - en: "Treat each as an unrelated case and do nothing more, since every complaint has its own history and facts"
        de: "Jede als unabhängigen Fall behandeln und nichts weiter tun, da jede Beschwerde ihre eigene Vorgeschichte und Fakten hat"
        correct: false
      - en: "Use the case files to rate employees in appraisals, since they show how people behave under pressure"
        de: "Die Fallakten zur Bewertung von Beschäftigten in Beurteilungen nutzen, da sie zeigen, wie Menschen unter Druck handeln"
        correct: false
    explanation:
      en: "Aggregated, anonymised patterns support prevention such as training. Case data should not be used beyond its purpose and must not identify individuals in small groups."
      de: "Aggregierte, anonymisierte Muster unterstützen Prävention, etwa durch Schulungen. Falldaten dürfen nicht über ihren Zweck hinaus genutzt werden und in kleinen Gruppen nicht Einzelne erkennbar machen."
    source: https://en.wikipedia.org/wiki/Employee_relations
