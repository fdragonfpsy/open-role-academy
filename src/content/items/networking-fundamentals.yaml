competency: networking-fundamentals
items:
  - id: nf-f-switch-router
    level: foundation
    difficulty: 900
    type: single
    stem:
      en: "What is the main job of a router in an office network?"
      de: "Was ist die Hauptaufgabe eines Routers in einem Büronetzwerk?"
    options:
      - en: "It connects different networks, for example the office LAN and the internet."
        de: "Er verbindet verschiedene Netze, zum Beispiel das Büro-LAN und das Internet."
        correct: true
      - en: "It translates every file that is sent into a format that the receiving device can open."
        de: "Es übersetzt jede gesendete Datei in ein Format, das das empfangende Gerät öffnen kann."
        correct: false
      - en: "It stores the passwords of all users and checks them whenever someone signs in to a computer."
        de: "Es speichert die Passwörter aller Nutzenden und prüft sie, wenn sich jemand an einem Computer anmeldet."
        correct: false
      - en: "It gives every device on the local network its own name, so that IP addresses are no longer needed."
        de: "Es gibt jedem Gerät im lokalen Netz einen eigenen Namen, sodass IP-Adressen nicht mehr nötig sind."
        correct: false
    explanation:
      en: "A switch connects devices inside one network, an access point adds radio access, and a router connects separate networks. Small devices often combine all three roles."
      de: "Ein Switch verbindet Geräte innerhalb eines Netzes, ein Access Point ergänzt den Funkzugang, und ein Router verbindet getrennte Netze. Kleine Geräte vereinen oft alle drei Rollen."
    source: https://en.wikipedia.org/wiki/IP_address
  - id: nf-f-dhcp
    level: foundation
    difficulty: 950
    type: single
    stem:
      en: "What does DHCP do for a device that joins the network?"
      de: "Was leistet DHCP für ein Gerät, das dem Netz beitritt?"
    options:
      - en: "It automatically assigns an IP address and related settings."
        de: "Es weist automatisch eine IP-Adresse und zugehörige Einstellungen zu."
        correct: true
      - en: "It encrypts all traffic of the device so that nobody on the network can read what is sent."
        de: "Es verschlüsselt den gesamten Datenverkehr des Geräts, sodass niemand im Netz mitlesen kann."
        correct: false
      - en: "It blocks websites that are not work related, based on a list kept by the network team."
        de: "Es sperrt nicht arbeitsbezogene Websites anhand einer Liste, die das Netzwerkteam pflegt."
        correct: false
      - en: "It translates the names of websites into addresses, so that the user can type names in the browser."
        de: "Es übersetzt die Namen von Websites in Adressen, damit Nutzende im Browser Namen eingeben können."
        correct: false
    explanation:
      en: "DHCP hands out addresses and settings such as gateway and DNS server so that nobody has to configure each device by hand."
      de: "DHCP vergibt Adressen und Einstellungen wie Gateway und DNS-Server, damit niemand jedes Gerät von Hand einrichten muss."
    source: https://en.wikipedia.org/wiki/IP_address
  - id: nf-f-dns
    level: foundation
    difficulty: 1000
    type: single
    stem:
      en: "A website does not open by its name, but it opens when you type its IP address. Which service is the most likely cause?"
      de: "Eine Website öffnet sich nicht über ihren Namen, aber über ihre IP-Adresse. Welcher Dienst ist die wahrscheinlichste Ursache?"
    options:
      - en: "DNS, which translates names into IP addresses."
        de: "DNS, das Namen in IP-Adressen übersetzt."
        correct: true
      - en: "The power supply of the switch."
        de: "Das Netzteil des Switches."
        correct: false
      - en: "The monitor settings."
        de: "Die Monitor-Einstellungen."
        correct: false
      - en: "The keyboard layout."
        de: "Das Tastaturlayout."
        correct: false
    explanation:
      en: "If the address works, the connection is fine. The missing step is the translation of the name, which is the job of DNS."
      de: "Funktioniert die Adresse, ist die Verbindung in Ordnung. Es fehlt die Übersetzung des Namens, und die ist Aufgabe von DNS."
    source: https://en.wikipedia.org/wiki/Domain_Name_System
  - id: nf-f-first-check
    level: foundation
    difficulty: 1050
    type: single
    stem:
      en: "One user reports no network. Which first step helps most to find out whether the problem is local to that device?"
      de: "Eine Person meldet kein Netzwerk. Welcher erste Schritt hilft am meisten herauszufinden, ob das Problem nur dieses Gerät betrifft?"
    options:
      - en: "Check whether other devices nearby can connect."
        de: "Prüfen, ob andere Geräte in der Nähe eine Verbindung haben."
        correct: true
      - en: "Reinstall the operating system."
        de: "Das Betriebssystem neu installieren."
        correct: false
      - en: "Replace the router at once."
        de: "Sofort den Router austauschen."
        correct: false
      - en: "Ask the user to try again tomorrow."
        de: "Die Person bitten, es morgen erneut zu versuchen."
        correct: false
    explanation:
      en: "Comparing with other devices separates a single-device fault from a problem with the access point, switch or uplink, before you change anything."
      de: "Der Vergleich mit anderen Geräten trennt einen Einzelgerätefehler von einem Problem mit Access Point, Switch oder Anbindung, bevor du etwas veränderst."
    source: https://en.wikipedia.org/wiki/IP_address
  - id: nf-p-gateway
    level: practitioner
    difficulty: 1190
    type: single
    stem:
      en: "A laptop can reach printers in its own subnet but nothing in other networks. Which setting is the most likely cause?"
      de: "Ein Laptop erreicht Drucker im eigenen Subnetz, aber nichts in anderen Netzen. Welche Einstellung ist die wahrscheinlichste Ursache?"
    options:
      - en: "A wrong or missing default gateway."
        de: "Ein falsches oder fehlendes Standardgateway."
        correct: true
      - en: "A hostname that is too long, so the laptop cannot be addressed from other networks."
        de: "Ein zu langer Hostname, sodass der Laptop aus anderen Netzen nicht angesprochen werden kann."
        correct: false
      - en: "A DNS server that is slow to answer, so that remote names take a long time to resolve."
        de: "Ein DNS-Server, der langsam antwortet, sodass entfernte Namen lange zur Auflösung brauchen."
        correct: false
      - en: "An outdated driver for the wireless adapter, which only allows connections to nearby devices."
        de: "Ein veralteter Treiber des WLAN-Adapters, der nur Verbindungen zu nahen Geräten zulässt."
        correct: false
    explanation:
      en: "Traffic to other networks is sent to the default gateway. Without a correct one, only the local subnet is reachable."
      de: "Verkehr in andere Netze geht an das Standardgateway. Ohne ein korrektes ist nur das lokale Subnetz erreichbar."
    source: https://en.wikipedia.org/wiki/Subnetwork
  - id: nf-p-dns-ip
    level: practitioner
    difficulty: 1240
    type: single
    stem:
      en: "Ping to an IP address works, ping to the matching name fails. What is the best next step?"
      de: "Ping auf eine IP-Adresse klappt, Ping auf den passenden Namen schlägt fehl. Was ist der beste nächste Schritt?"
    options:
      - en: "Check which DNS server the client uses and test name resolution, for example with nslookup."
        de: "Prüfen, welchen DNS-Server der Client nutzt, und die Namensauflösung testen, z. B. mit nslookup."
        correct: true
      - en: "Replace the network cable, because a cable fault typically lets only some kinds of requests fail."
        de: "Das Netzwerkkabel ersetzen, weil ein Kabelfehler typischerweise nur bestimmte Anfragen scheitern lässt."
        correct: false
      - en: "Change the subnet mask of the client, since a wrong mask lets name lookups fail but pings succeed."
        de: "Die Subnetzmaske des Clients ändern, da eine falsche Maske Namensabfragen scheitern, Pings aber gelingen lässt."
        correct: false
      - en: "Disable the firewall on all servers, so that the name-based request is no longer blocked anywhere."
        de: "Die Firewall auf allen Servern abschalten, damit die namensbasierte Anfrage nirgends mehr blockiert wird."
        correct: false
    explanation:
      en: "Reaching the address by number shows that the path works. The fault lies in name resolution, so test DNS directly."
      de: "Dass die Adresse per Nummer erreichbar ist, zeigt, dass der Weg funktioniert. Der Fehler liegt in der Namensauflösung, also teste DNS direkt."
    source: https://en.wikipedia.org/wiki/Domain_Name_System
  - id: nf-p-vpn
    level: practitioner
    difficulty: 1290
    type: single
    stem:
      en: "What does a VPN protect, and what does it not do?"
      de: "Was schützt ein VPN, und was leistet es nicht?"
    options:
      - en: "It protects traffic in transit with an encrypted tunnel, but does not make an infected device safe."
        de: "Es schützt Daten auf dem Transportweg durch einen verschlüsselten Tunnel, macht ein infiziertes Gerät aber nicht sicher."
        correct: true
      - en: "It removes malware from the device, because all traffic is scanned before it enters the tunnel."
        de: "Es entfernt Schadsoftware vom Gerät, weil der gesamte Datenverkehr vor dem Tunnel geprüft wird."
        correct: false
      - en: "It makes sign-in with a password unnecessary, because the tunnel already proves who the user is."
        de: "Es macht die Anmeldung mit Passwort überflüssig, weil der Tunnel bereits belegt, wer die Person ist."
        correct: false
      - en: "It guarantees that every website reached through the tunnel is trustworthy and free of harmful content."
        de: "Es garantiert, dass jede über den Tunnel erreichte Website vertrauenswürdig und frei von schädlichen Inhalten ist."
        correct: false
    explanation:
      en: "A VPN secures the connection between the device and the target network. The state of the device and the sign-in controls still matter."
      de: "Ein VPN sichert die Verbindung zwischen Gerät und Zielnetz. Der Zustand des Geräts und die Anmeldekontrollen bleiben wichtig."
    source: https://en.wikipedia.org/wiki/Virtual_private_network
  - id: nf-p-port
    level: practitioner
    difficulty: 1340
    type: single
    stem:
      en: "A server answers ping, but its web service cannot be reached from the staff network. What is a plausible cause?"
      de: "Ein Server antwortet auf Ping, sein Webdienst ist aber aus dem Mitarbeitenden-Netz nicht erreichbar. Was ist eine plausible Ursache?"
    options:
      - en: "A firewall rule blocks the service's port, or the service is not running."
        de: "Eine Firewall-Regel blockiert den Port des Dienstes, oder der Dienst läuft nicht."
        correct: true
      - en: "Ping can never work while a server is online, so the result shows the server is already faulty."
        de: "Ping kann bei einem laufenden Server nie funktionieren, daher zeigt das Ergebnis einen Serverfehler."
        correct: false
      - en: "The server has no IP address, so it cannot be reached by any kind of request from the staff network."
        de: "Der Server hat keine IP-Adresse, daher ist er aus dem Mitarbeiternetz mit keiner Anfrage erreichbar."
        correct: false
      - en: "The network cable of the server is unplugged, which would stop the web service but not the ping."
        de: "Das Netzwerkkabel des Servers ist gezogen, was den Webdienst, aber nicht den Ping stoppen würde."
        correct: false
    explanation:
      en: "Ping shows the host is reachable. A service is reached through a port, so a blocking rule or a stopped service explains the symptom."
      de: "Ping zeigt, dass der Host erreichbar ist. Ein Dienst wird über einen Port erreicht, daher erklären eine blockierende Regel oder ein gestoppter Dienst das Symptom."
    source: https://en.wikipedia.org/wiki/Firewall_(computing)
  - id: nf-a-segmentation
    level: advanced
    difficulty: 1520
    type: single
    stem:
      en: "What is the main security benefit of network segmentation?"
      de: "Was ist der wichtigste Sicherheitsvorteil der Netzwerksegmentierung?"
    options:
      - en: "A compromise in one zone is limited by rules between the zones."
        de: "Eine Kompromittierung in einer Zone wird durch Regeln zwischen den Zonen begrenzt."
        correct: true
      - en: "It removes the need for patching, because separated zones cannot be reached by outside attackers."
        de: "Es macht Patchen überflüssig, weil getrennte Zonen für Angreifende von außen nicht erreichbar sind."
        correct: false
      - en: "It makes all traffic faster in every case, because each zone has its own bandwidth and fewer devices."
        de: "Es beschleunigt jeden Datenverkehr, weil jede Zone eigene Bandbreite und weniger Geräte hat."
        correct: false
      - en: "It prevents any device from being attacked, because zones are invisible from the other zones."
        de: "Es verhindert, dass irgendein Gerät angegriffen wird, weil Zonen für andere Zonen unsichtbar sind."
        correct: false
    explanation:
      en: "Segmentation does not stop attacks, but it limits lateral movement. Patching and other controls remain necessary."
      de: "Segmentierung stoppt keine Angriffe, begrenzt aber die seitliche Ausbreitung. Patchen und andere Maßnahmen bleiben nötig."
    source: https://en.wikipedia.org/wiki/Subnetwork
  - id: nf-a-zerotrust
    level: advanced
    difficulty: 1580
    type: single
    stem:
      en: "Which statement best describes the idea of zero trust?"
      de: "Welche Aussage beschreibt die Idee von Zero Trust am besten?"
    options:
      - en: "Access is decided per request from identity, device state and context, not from network location."
        de: "Zugriff wird pro Anfrage anhand von Identität, Gerätezustand und Kontext entschieden, nicht anhand des Netzstandorts."
        correct: true
      - en: "Everything inside the office network is trusted automatically, while all outside access is verified."
        de: "Alles im Büronetz wird automatisch vertraut, während jeder Zugriff von außen geprüft wird."
        correct: false
      - en: "Nobody may use the network until each user has signed a policy that confirms they are trustworthy."
        de: "Niemand darf das Netz nutzen, bevor jede Person eine Richtlinie unterschrieben hat, die ihre Vertrauenswürdigkeit bestätigt."
        correct: false
      - en: "A strong firewall at the border is sufficient, as long as it is configured and monitored carefully."
        de: "Eine starke Firewall am Netzrand genügt, solange sie sorgfältig konfiguriert und überwacht wird."
        correct: false
    explanation:
      en: "Zero trust removes implicit trust based on location and checks each request, while giving only the access that is needed."
      de: "Zero Trust entfernt das implizite Vertrauen aufgrund des Standorts und prüft jede Anfrage, bei Zugriff nur im nötigen Umfang."
    source: https://en.wikipedia.org/wiki/Firewall_(computing)
  - id: nf-a-spof
    level: advanced
    difficulty: 1550
    type: single
    stem:
      en: "A site has one internet uplink. How should the risk be handled?"
      de: "Ein Standort hat nur eine Internetanbindung. Wie sollte das Risiko behandelt werden?"
    options:
      - en: "Identify it as a single point of failure, weigh a second path against business impact, and test failover."
        de: "Es als Single Point of Failure erkennen, einen zweiten Pfad gegen die geschäftlichen Auswirkungen abwägen und den Failover testen."
        correct: true
      - en: "Buy a second uplink from the same provider at once, because redundancy is always worth its cost."
        de: "Sofort einen zweiten Anschluss beim selben Anbieter kaufen, weil sich Redundanz immer lohnt."
        correct: false
      - en: "Accept the risk permanently, because the provider's contract already covers any outage of the uplink."
        de: "Das Risiko dauerhaft akzeptieren, weil der Vertrag mit dem Anbieter jeden Ausfall des Anschlusses abdeckt."
        correct: false
      - en: "Add a backup uplink and document it, but skip failover tests so that production is never disturbed."
        de: "Einen Ersatzanschluss einrichten und dokumentieren, aber Failover-Tests auslassen, damit der Betrieb nie gestört wird."
        correct: false
    explanation:
      en: "Redundancy costs money and adds complexity, so it is justified by impact, and untested failover cannot be relied on."
      de: "Redundanz kostet Geld und erhöht die Komplexität, wird also durch die Auswirkungen begründet, und ungetestetes Failover ist nicht verlässlich."
    source: https://en.wikipedia.org/wiki/OSI_model
  - id: nf-a-change
    level: advanced
    difficulty: 1620
    type: single
    stem:
      en: "Which preparation is most important before changing a firewall rule set in production?"
      de: "Welche Vorbereitung ist vor der Änderung eines Firewall-Regelsatzes im Betrieb am wichtigsten?"
    options:
      - en: "Know the dependent systems, define verification steps and have a tested rollback plan."
        de: "Die abhängigen Systeme kennen, Prüfschritte festlegen und einen getesteten Rückfallplan haben."
        correct: true
      - en: "Apply the change quietly outside working hours, so that no user notices anything and nobody panics."
        de: "Die Änderung unauffällig außerhalb der Arbeitszeit durchführen, damit niemand etwas bemerkt und keine Panik entsteht."
        correct: false
      - en: "Delete the old documentation first, so that nobody follows outdated rules after the change is done."
        de: "Zuerst die alte Dokumentation löschen, damit nach der Änderung niemand veralteten Regeln folgt."
        correct: false
      - en: "Bundle several unrelated rule changes into one window, so that the risk of disruption is taken only once."
        de: "Mehrere unabhängige Regeländerungen in einem Zeitfenster bündeln, damit das Störungsrisiko nur einmal eingegangen wird."
        correct: false
    explanation:
      en: "Impact analysis, verification and rollback keep a faulty change from becoming a long outage."
      de: "Auswirkungsanalyse, Prüfung und Rückfall verhindern, dass eine fehlerhafte Änderung zu einem langen Ausfall wird."
    source: https://en.wikipedia.org/wiki/Firewall_(computing)
