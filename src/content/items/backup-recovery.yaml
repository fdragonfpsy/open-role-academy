competency: backup-recovery
items:
  - id: bk-f-why
    level: foundation
    difficulty: 900
    type: single
    stem:
      en: "What is a backup?"
      de: "Was ist eine Datensicherung?"
    options:
      - en: "A separate additional copy of data that can be used to restore it"
        de: "Eine getrennte zusätzliche Kopie von Daten, mit der sie wiederhergestellt werden können"
        correct: true
      - en: "A second name for the original file, kept in the same folder so that it can be found quickly"
        de: "Ein zweiter Name für die Originaldatei, der im selben Ordner liegt, damit sie schnell gefunden wird"
        correct: false
      - en: "A password that protects a folder against unauthorised access and can be reset by the administrator"
        de: "Ein Passwort, das einen Ordner vor unbefugtem Zugriff schützt und von der Administration zurückgesetzt werden kann"
        correct: false
      - en: "A faster way to open large files, based on a copy that is kept in the computer's working memory"
        de: "Ein schnellerer Weg, große Dateien zu öffnen, der auf einer Kopie im Arbeitsspeicher des Computers beruht"
        correct: false
    explanation:
      en: "A backup is a separate copy kept so that data can be restored after loss, error or attack."
      de: "Eine Sicherung ist eine getrennt aufbewahrte Kopie, damit Daten nach Verlust, Fehler oder Angriff wiederhergestellt werden können."
    source: https://en.wikipedia.org/wiki/Backup
  - id: bk-f-types
    level: foundation
    difficulty: 950
    type: single
    stem:
      en: "Which backup type copies only what changed since the last full backup?"
      de: "Welche Sicherungsart kopiert nur, was sich seit der letzten Vollsicherung geändert hat?"
    options:
      - en: "Differential backup, which copies everything changed since the last full backup"
        de: "Differenzielle Sicherung, die alles seit der letzten Vollsicherung Geänderte kopiert"
        correct: true
      - en: "Full backup, which copies everything that is selected for the backup every time"
        de: "Vollsicherung, die jedes Mal alles Ausgewählte kopiert"
        correct: false
      - en: "Incremental backup, which always copies everything again"
        de: "Inkrementelle Sicherung, die immer alles erneut kopiert"
        correct: false
      - en: "Mirror backup, which copies only what changed since the previous backup of any type"
        de: "Spiegelsicherung, die nur kopiert, was sich seit der vorherigen Sicherung beliebigen Typs geändert hat"
        correct: false
    explanation:
      en: "A differential backup contains the changes since the last full backup, so a restore needs the last full backup plus the latest differential one. An incremental backup contains the changes since the last backup of any kind."
      de: "Eine differenzielle Sicherung enthält die Änderungen seit der letzten Vollsicherung; für die Wiederherstellung genügen die letzte Vollsicherung und die neueste differenzielle Sicherung. Eine inkrementelle Sicherung enthält die Änderungen seit der letzten Sicherung beliebiger Art."
    source: https://en.wikipedia.org/wiki/Backup
  - id: bk-f-321
    level: foundation
    difficulty: 1000
    type: single
    stem:
      en: "What does the 3-2-1 idea say?"
      de: "Was besagt die 3-2-1-Idee?"
    options:
      - en: "Three copies of the data, on two kinds of storage, with one copy offsite"
        de: "Drei Kopien der Daten, auf zwei Arten von Speicher, davon eine Kopie extern"
        correct: true
      - en: "Three passwords, two users, one administrator"
        de: "Drei Passwörter, zwei Nutzende, eine Administration"
        correct: false
      - en: "Three backups per year, two per month, one per week"
        de: "Drei Sicherungen pro Jahr, zwei pro Monat, eine pro Woche"
        correct: false
      - en: "Three servers in one room, two switches, one router"
        de: "Drei Server in einem Raum, zwei Switches, ein Router"
        correct: false
    explanation:
      en: "The rule of thumb spreads copies across media and locations so that no single event destroys all of them."
      de: "Die Faustregel verteilt Kopien auf Medien und Orte, damit kein einzelnes Ereignis alle zerstören kann."
    source: https://en.wikipedia.org/wiki/Backup
  - id: bk-f-raid
    level: foundation
    difficulty: 1050
    type: single
    stem:
      en: "A file server uses RAID. A user deletes an important folder by mistake. What does this mean for backups?"
      de: "Ein Dateiserver nutzt RAID. Jemand löscht versehentlich einen wichtigen Ordner. Was bedeutet das für die Datensicherung?"
    options:
      - en: "RAID is not a backup: a deletion applies to all disks, so a real backup is needed to restore the folder"
        de: "RAID ist kein Backup: Das Löschen gilt für alle Platten, daher braucht man eine echte Sicherung, um den Ordner wiederherzustellen"
        correct: true
      - en: "RAID automatically restores the folder from another disk, because the disks keep copies of old states"
        de: "RAID stellt den Ordner automatisch von einer anderen Platte wieder her, weil die Platten ältere Stände vorhalten"
        correct: false
      - en: "RAID makes backups unnecessary on any server, because it already protects against every kind of loss"
        de: "RAID macht Backups auf jedem Server überflüssig, weil es bereits vor jeder Art von Verlust schützt"
        correct: false
      - en: "The folder cannot be restored under any circumstances, since the deletion was made by an authorised user"
        de: "Der Ordner kann unter keinen Umständen wiederhergestellt werden, da die Löschung von einer berechtigten Person stammt"
        correct: false
    explanation:
      en: "RAID keeps a system available when a disk fails, but it copies deletions and overwrites to every disk. A separate backup is the protection against mistakes and attacks."
      de: "RAID hält ein System bei einem Plattenausfall verfügbar, überträgt aber Löschungen und Überschreibungen auf alle Platten. Schutz vor Fehlern und Angriffen bietet eine getrennte Sicherung."
    source: https://en.wikipedia.org/wiki/Redundant_array_of_independent_disks
  - id: bk-p-rpo
    level: practitioner
    difficulty: 1190
    type: single
    stem:
      en: "The business accepts losing at most four hours of data. Which term describes this, and what does it imply?"
      de: "Das Unternehmen akzeptiert höchstens vier Stunden Datenverlust. Welcher Begriff beschreibt das, und was folgt daraus?"
    options:
      - en: "RPO of four hours; backups must run at least every four hours"
        de: "RPO von vier Stunden; Sicherungen müssen mindestens alle vier Stunden laufen"
        correct: true
      - en: "RTO of four hours; backups must run once a week, because the RTO sets how often data is copied"
        de: "RTO von vier Stunden; Backups müssen einmal pro Woche laufen, weil der RTO bestimmt, wie oft Daten kopiert werden"
        correct: false
      - en: "RPO of four hours; one nightly backup is enough, since the data is only lost when a disk fails"
        de: "RPO von vier Stunden; ein nächtliches Backup genügt, da Daten nur bei einem Festplattenausfall verloren gehen"
        correct: false
      - en: "RTO of four hours; the data may be lost completely, as only the time to restore the service counts"
        de: "RTO von vier Stunden; die Daten dürfen komplett verloren gehen, da nur die Wiederherstellungszeit des Dienstes zählt"
        correct: false
    explanation:
      en: "The recovery point objective is the maximum acceptable data loss measured in time. It sets the minimum backup frequency. The RTO is about how long a service may be down."
      de: "Das Recovery Point Objective ist der maximal akzeptable Datenverlust, gemessen in Zeit. Es legt die Mindesthäufigkeit der Sicherung fest. Das RTO betrifft, wie lange ein Dienst ausfallen darf."
    source: https://en.wikipedia.org/wiki/Recovery_point_objective
  - id: bk-p-monitor
    level: practitioner
    difficulty: 1240
    type: single
    stem:
      en: "Which monitoring practice best prevents backups from failing unnoticed?"
      de: "Welche Überwachungspraxis verhindert am besten, dass Sicherungen unbemerkt fehlschlagen?"
    options:
      - en: "Check each job result and unusual data sizes, and turn failures into alerts or tickets with an owner"
        de: "Jedes Job-Ergebnis und ungewöhnliche Datenmengen prüfen und Fehler in Alarme oder Tickets mit Verantwortlichen überführen"
        correct: true
      - en: "Assume it works as long as nobody complains, because users notice quickly when data goes missing"
        de: "Davon ausgehen, dass es funktioniert, solange sich niemand beschwert, weil Nutzende fehlende Daten schnell bemerken"
        correct: false
      - en: "Check the backup software only once a year, in a full audit that also covers the storage hardware"
        de: "Die Backup-Software nur einmal jährlich prüfen, in einem vollständigen Audit, das auch die Speicherhardware umfasst"
        correct: false
      - en: "Turn off all warnings to reduce noise, and rely on the vendor's default reports being sent weekly"
        de: "Alle Warnungen abschalten, um Rauschen zu verringern, und sich auf die wöchentlichen Standardberichte des Herstellers verlassen"
        correct: false
    explanation:
      en: "Silent failures are the typical risk. Results, size changes and free space should be checked, and failures must reach a person who is responsible."
      de: "Stille Fehler sind das typische Risiko. Ergebnisse, Größenänderungen und freier Speicher sollten geprüft werden, und Fehler müssen eine zuständige Person erreichen."
    source: https://en.wikipedia.org/wiki/Backup
  - id: bk-p-encrypt
    level: practitioner
    difficulty: 1290
    type: single
    stem:
      en: "You encrypt an offsite backup. What must you also make sure of?"
      de: "Du verschlüsselst eine externe Sicherung. Worauf musst du außerdem achten?"
    options:
      - en: "The encryption keys are stored separately and are themselves recoverable"
        de: "Die Schlüssel werden getrennt aufbewahrt und sind selbst wiederherstellbar"
        correct: true
      - en: "The key is stored in a file on the same backup, so that it is always available when it is needed"
        de: "Der Schlüssel liegt in einer Datei auf demselben Backup, damit er im Bedarfsfall immer verfügbar ist"
        correct: false
      - en: "The key is shared with all employees, so that anyone can restore data when the administrator is away"
        de: "Der Schlüssel wird mit allen Beschäftigten geteilt, damit jede Person wiederherstellen kann, wenn die Administration fehlt"
        correct: false
      - en: "Nothing further; a lost key can always be recreated from the encrypted backup data by the software"
        de: "Nichts weiter; ein verlorener Schlüssel lässt sich aus den verschlüsselten Backup-Daten stets durch die Software neu erzeugen"
        correct: false
    explanation:
      en: "Encryption protects lost or leaked copies, but a backup whose key is lost cannot be restored, and a key stored next to the backup offers little protection."
      de: "Verschlüsselung schützt verlorene oder abgeflossene Kopien, aber eine Sicherung mit verlorenem Schlüssel lässt sich nicht zurückspielen, und ein Schlüssel neben der Sicherung schützt kaum."
    source: https://en.wikipedia.org/wiki/Backup
  - id: bk-p-request
    level: practitioner
    difficulty: 1340
    type: single
    stem:
      en: "A user asks you to recover a folder that was deleted last week. What is the best approach?"
      de: "Ein Nutzer bittet dich, einen letzte Woche gelöschten Ordner wiederherzustellen. Was ist das beste Vorgehen?"
    options:
      - en: "Verify identity and permission, restore to a separate location, let the user check, then record it"
        de: "Identität und Berechtigung prüfen, an einen separaten Ort wiederherstellen, die Person prüfen lassen und es dokumentieren"
        correct: true
      - en: "Restore over the current folder immediately without asking, since the user clearly needs the data back"
        de: "Sofort über den aktuellen Ordner zurückspielen, ohne nachzufragen, da die Person die Daten offensichtlich braucht"
        correct: false
      - en: "Refuse, because backups are meant for disaster recovery and are never used for single folders"
        de: "Ablehnen, weil Backups für die Notfallwiederherstellung gedacht sind und nie für einzelne Ordner genutzt werden"
        correct: false
      - en: "Send the whole backup file to the user, so that they can search for the folder and copy it themselves"
        de: "Die gesamte Sicherungsdatei an die Person schicken, damit sie den Ordner selbst suchen und kopieren kann"
        correct: false
    explanation:
      en: "Restoring to a separate location first avoids overwriting newer data and lets the user confirm the right version. Identity and permission checks protect other people's data."
      de: "Die Wiederherstellung an einen separaten Ort vermeidet das Überschreiben neuerer Daten und lässt die Person die richtige Version bestätigen. Prüfungen von Identität und Berechtigung schützen die Daten anderer."
    source: https://en.wikipedia.org/wiki/Backup
  - id: bk-a-priority
    level: advanced
    difficulty: 1520
    type: single
    stem:
      en: "How should the recovery order of systems be decided in a disaster recovery plan?"
      de: "Wie sollte die Reihenfolge der Wiederherstellung von Systemen in einem Disaster-Recovery-Plan festgelegt werden?"
    options:
      - en: "By business impact and technical dependencies, agreed with management"
        de: "Nach Geschäftsauswirkung und technischen Abhängigkeiten, abgestimmt mit der Leitung"
        correct: true
      - en: "By the size of each system, starting with the largest, because it takes the longest to restore"
        de: "Nach der Größe der Systeme, beginnend mit dem größten, weil es am längsten zur Wiederherstellung braucht"
        correct: false
      - en: "By the age of each system, starting with the oldest, because old systems are the most likely to fail again"
        de: "Nach dem Alter der Systeme, beginnend mit dem ältesten, weil alte Systeme am ehesten erneut ausfallen"
        correct: false
      - en: "By the order in which users report problems, so that the loudest complaints are handled first"
        de: "Nach der Reihenfolge der Problemmeldungen, damit die lautesten Beschwerden zuerst bearbeitet werden"
        correct: false
    explanation:
      en: "A business impact analysis shows which systems matter most, and dependencies such as directory service, database and network decide what must come up first."
      de: "Eine Business-Impact-Analyse zeigt, welche Systeme am wichtigsten sind, und Abhängigkeiten wie Verzeichnisdienst, Datenbank und Netzwerk bestimmen, was zuerst laufen muss."
    source: https://en.wikipedia.org/wiki/Disaster_recovery
  - id: bk-a-immutable
    level: advanced
    difficulty: 1580
    type: single
    stem:
      en: "Which measure best protects backups against attackers who try to delete them after breaking in?"
      de: "Welche Maßnahme schützt Sicherungen am besten vor Angreifenden, die sie nach einem Einbruch löschen wollen?"
    options:
      - en: "Immutable or offline copies with separate credentials for the backup system"
        de: "Unveränderliche oder Offline-Kopien mit getrennten Zugangsdaten für das Sicherungssystem"
        correct: true
      - en: "Keeping the backup share mounted permanently on all servers, so that backups run without delay"
        de: "Die Backup-Freigabe dauerhaft auf allen Servern eingebunden lassen, damit Sicherungen ohne Verzögerung laufen"
        correct: false
      - en: "Using the same administrator password as in production, so that staff manage only one credential"
        de: "Dasselbe Administratorpasswort wie in der Produktion verwenden, damit das Personal nur eine Zugangsdatenkombination pflegt"
        correct: false
      - en: "Storing the only backup on the production storage, so that recovery is fast when it is needed"
        de: "Das einzige Backup auf dem Produktivspeicher ablegen, damit die Wiederherstellung im Ernstfall schnell geht"
        correct: false
    explanation:
      en: "Attackers who control production access often look for backups. Copies that cannot be changed or reached, and separate credentials, keep at least one clean copy available."
      de: "Angreifende mit Zugriff auf die Produktion suchen oft nach Sicherungen. Kopien, die nicht änderbar oder erreichbar sind, und getrennte Zugangsdaten halten mindestens eine saubere Kopie verfügbar."
    source: https://en.wikipedia.org/wiki/Disaster_recovery
  - id: bk-a-exercise
    level: advanced
    difficulty: 1550
    type: single
    stem:
      en: "A recovery exercise took longer than the agreed RTO and a runbook step was unclear. What is the right conclusion?"
      de: "Eine Wiederherstellungsübung dauerte länger als das vereinbarte RTO, und ein Schritt im Runbook war unklar. Was ist die richtige Schlussfolgerung?"
    options:
      - en: "Record the findings, fix the runbook and method, and discuss the RTO with the owner"
        de: "Feststellungen dokumentieren, Runbook und Verfahren verbessern und das RTO mit der Verantwortlichen besprechen"
        correct: true
      - en: "Ignore it, since the exercise was only a test and real incidents will be handled with more focus"
        de: "Ignorieren, da die Übung nur ein Test war und echte Vorfälle mit mehr Konzentration bearbeitet werden"
        correct: false
      - en: "Change the documented RTO silently to match the result, so the plan agrees with what was measured"
        de: "Den dokumentierten RTO stillschweigend an das Ergebnis anpassen, damit der Plan zum Gemessenen passt"
        correct: false
      - en: "Stop further exercises until the runbook is rewritten, since they only show problems and cost time"
        de: "Weitere Übungen aussetzen, bis das Runbook neu geschrieben ist, da sie nur Probleme zeigen und Zeit kosten"
        correct: false
    explanation:
      en: "The purpose of an exercise is to find gaps. Results feed back into runbooks, methods and, openly agreed with the owner, into the targets."
      de: "Zweck einer Übung ist, Lücken zu finden. Die Ergebnisse fließen in Runbooks, Verfahren und, offen mit den Verantwortlichen abgestimmt, in die Ziele ein."
    source: https://en.wikipedia.org/wiki/Disaster_recovery
  - id: bk-a-gdpr
    level: advanced
    difficulty: 1620
    type: single
    stem:
      en: "In the EU, backups containing personal data are kept. Which statement is most appropriate?"
      de: "In der EU werden Sicherungen mit personenbezogenen Daten aufbewahrt. Welche Aussage passt am besten?"
    options:
      - en: "Retention should be defined, documented and limited to what is needed, with encryption and access control"
        de: "Die Aufbewahrung sollte festgelegt, dokumentiert und auf das Nötige begrenzt sein – mit Verschlüsselung und Zugriffskontrolle"
        correct: true
      - en: "Backups are outside data protection rules, because they are technical copies and not the live records"
        de: "Backups liegen außerhalb der Datenschutzregeln, weil sie technische Kopien und nicht die Echtdaten sind"
        correct: false
      - en: "Backups should be kept forever, just in case, because deleting any copy could harm the business"
        de: "Backups sollten für alle Fälle ewig aufbewahrt werden, weil das Löschen einer Kopie dem Geschäft schaden könnte"
        correct: false
      - en: "Backups need no further protection if they are offsite, because the location already secures them"
        de: "Backups brauchen keinen weiteren Schutz, wenn sie extern liegen, weil der Standort sie bereits sichert"
        correct: false
    explanation:
      en: "Under the GDPR, principles such as storage limitation and security of processing also apply to backups. Details depend on the case, so involve the data protection officer. This item is about the EU context."
      de: "Nach der DSGVO gelten Grundsätze wie Speicherbegrenzung und Sicherheit der Verarbeitung auch für Sicherungen. Die Einzelheiten hängen vom Fall ab, beziehe daher die Datenschutzbeauftragten ein. Diese Aufgabe betrifft den EU-Kontext."
    source: https://en.wikipedia.org/wiki/Backup
