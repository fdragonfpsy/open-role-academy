id: customer-service
kind: role
status: published
title:
  en: Customer Service
  de: Kundenservice
summary:
  en: >-
    Help customers well: listen and communicate with empathy, understand and solve problems, handle complaints
    and de-escalate, work across phone, email, chat and social channels, use ticketing and knowledge bases,
    protect customer data, steer service quality and recognise common consumer-rights topics.
  de: >-
    Kundschaft gut betreuen: einfühlsam zuhören und kommunizieren, Anliegen verstehen und lösen, Beschwerden
    bearbeiten und deeskalieren, über Telefon, E-Mail, Chat und Social Media arbeiten, Ticketsystem und
    Wissensdatenbank nutzen, Kundendaten schützen, Servicequalität steuern und typische Verbraucherrechtsthemen erkennen.
