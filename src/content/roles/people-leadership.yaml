id: people-leadership
kind: role
status: published
title:
  en: People Leadership
  de: Personalführung
summary:
  en: >-
    Lead a team well: grow from expert to team lead, delegate with clear accountability, set goals and plan work, hold one-to-one conversations and coach, give feedback, build a team with psychological safety, keep people motivated, handle conflicts, run effective meetings and decisions, lead through change, and know the labour-law and diversity basics for leaders in Germany and the EU.
  de: >-
    Ein Team gut führen: vom Fachexperten zur Teamleitung wachsen, mit klarer Verantwortung delegieren, Ziele setzen und Arbeit planen, Einzelgespräche führen und coachen, Feedback geben, ein Team mit psychologischer Sicherheit aufbauen, Menschen motiviert halten, Konflikte bearbeiten, Meetings und Entscheidungen wirksam gestalten, Veränderungen begleiten und die arbeitsrechtlichen und Diversity-Grundlagen für Führungskräfte in Deutschland und der EU kennen.
