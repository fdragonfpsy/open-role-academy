id: software-development
kind: role
status: draft
title:
  en: Software Development
  de: Softwareentwicklung
summary:
  en: >-
    Build and ship reliable software: solve problems in code, collaborate with version control, design maintainable structures, test and debug, connect systems through APIs, model and store data, write secure code, automate delivery with CI/CD, and work in agile teams with requirements and code review.
  de: >-
    Zuverlässige Software entwickeln und ausliefern: Probleme in Code lösen, mit Versionsverwaltung zusammenarbeiten, wartbare Strukturen entwerfen, testen und Fehler suchen, Systeme über APIs verbinden, Daten modellieren und speichern, sicheren Code schreiben, die Auslieferung mit CI/CD automatisieren und in agilen Teams mit Anforderungen und Code-Review arbeiten.
