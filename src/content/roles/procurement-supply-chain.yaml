id: procurement-supply-chain
kind: role
status: draft
title:
  en: Procurement & Supply Chain
  de: Einkauf & Supply Chain
summary:
  en: >-
    Buy and move goods and services reliably: understand purchase-to-pay, source strategically, select and evaluate suppliers, run tenders and contracts, negotiate and manage supplier relationships, handle orders and invoices, control inventory and warehouses, plan logistics and transport, balance supply and demand, and manage supply chain risk and sustainability.
  de: >-
    Waren und Dienstleistungen zuverlässig beschaffen und bewegen: Purchase-to-Pay verstehen, strategisch einkaufen, Lieferanten auswählen und bewerten, Ausschreibungen und Verträge durchführen, verhandeln und Lieferantenbeziehungen steuern, Bestellungen und Rechnungen abwickeln, Bestände und Lager steuern, Logistik und Transport planen, Angebot und Nachfrage abstimmen sowie Lieferkettenrisiken und Nachhaltigkeit managen.
