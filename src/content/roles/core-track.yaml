id: core-track
kind: core
title:
  en: Core skills for every role
  de: Kernkompetenzen für jede Rolle
summary:
  en: >-
    The shared core track that every role builds on. Currently available: digital and AI literacy,
    communication and collaboration, information security basics,
    working with data, and self-organisation and project basics (business and finance fundamentals
    follow).
  de: >-
    Der gemeinsame Kernbereich, auf dem jede Rolle aufbaut. Aktuell verfügbar: digitale Kompetenz und
    KI-Kompetenz, Kommunikation und Zusammenarbeit, Grundlagen der Informationssicherheit,
    Arbeiten mit Daten sowie Selbstorganisation und Projektgrundlagen (betriebswirtschaftliche
    Grundlagen folgen).
