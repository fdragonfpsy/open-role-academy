id: it-support-operations
kind: role
title:
  en: IT Support & Operations
  de: IT-Support & -Betrieb
summary:
  en: >-
    Keep people productive and IT running: handle incidents and requests, troubleshoot devices,
    accounts and networks, and operate IT services securely and reliably.
  de: >-
    Sorgt dafür, dass Menschen produktiv arbeiten und die IT läuft: Störungen und Anfragen
    bearbeiten, Geräte, Konten und Netzwerke analysieren und IT-Services sicher und zuverlässig
    betreiben.
