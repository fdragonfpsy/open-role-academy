id: legal-compliance
kind: role
status: published
title:
  en: Legal & Compliance
  de: Recht & Compliance
summary:
  en: >-
    Help the organisation act within the rules: understand sources of law in the EU and Germany, review contracts, apply data protection, run compliance management, prevent corruption and handle whistleblower reports, protect intellectual property, monitor regulation, assess legal risks, support audits and organise legal work.
  de: >-
    Die Organisation dabei unterstützen, regelkonform zu handeln: Rechtsquellen in der EU und in Deutschland verstehen, Verträge prüfen, Datenschutz anwenden, Compliance managen, Korruption vorbeugen und Hinweise von Hinweisgebenden bearbeiten, geistiges Eigentum schützen, Regulierung beobachten, rechtliche Risiken bewerten, Prüfungen unterstützen und die Rechtsarbeit organisieren.
