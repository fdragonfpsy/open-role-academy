id: finance-accounting
kind: role
title:
  en: Finance & Accounting
  de: Finanz- und Rechnungswesen
summary:
  en: >-
    Keep the books right and the money flowing: record transactions, manage payables and
    receivables, close periods, comply with tax rules and turn numbers into decisions.
  de: >-
    Sorgt für korrekte Bücher und funktionierende Zahlungsströme: Geschäftsvorfälle erfassen,
    Kreditoren und Debitoren steuern, Perioden abschließen, Steuerregeln einhalten und Zahlen in
    Entscheidungen übersetzen.
