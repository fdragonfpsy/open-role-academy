id: data-analytics
kind: role
status: draft
title:
  en: Data & Analytics
  de: Data & Analytics
summary:
  en: >-
    Turn data into decisions: understand the analytics lifecycle, source and collect data, ensure data quality, query data with SQL, apply statistics, visualise results in dashboards, build business intelligence reports, frame problems and tell data stories, handle data responsibly under EU and German privacy rules, and understand machine learning basics.
  de: >-
    Aus Daten Entscheidungen machen: den Analytics-Ablauf verstehen, Daten beschaffen und erheben, Datenqualität sichern, Daten mit SQL abfragen, Statistik anwenden, Ergebnisse in Dashboards visualisieren, Business-Intelligence-Berichte erstellen, Probleme formulieren und Daten-Geschichten erzählen, verantwortungsvoll mit Daten nach EU- und deutschem Datenschutz umgehen und die Grundlagen des maschinellen Lernens verstehen.
