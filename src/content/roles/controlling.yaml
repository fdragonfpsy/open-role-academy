    Das Unternehmen mit Zahlen steuern: Kosten und Profitabilität analysieren, planen und prognostizieren, Abweichungen erklären, Investitionen bewerten, Liquidität überwachen, den Berichtszyklus betreiben und Führungskräfte als Business Partner beraten.
