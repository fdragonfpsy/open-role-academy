id: project-management
kind: role
status: published
title:
  en: Project Management
  de: Projektmanagement
summary:
  en: >-
    Deliver projects successfully: initiate with a business case, define scope and requirements, break down and schedule work, control budget, manage risks and issues, engage stakeholders, coordinate teams and resources, apply agile and hybrid approaches, manage quality and change, and close projects with lessons learned.
  de: >-
    Projekte erfolgreich umsetzen: mit einem Business Case starten, Umfang und Anforderungen definieren, Arbeit gliedern und terminieren, das Budget steuern, Risiken und Issues managen, Stakeholder einbinden, Teams und Ressourcen koordinieren, agile und hybride Vorgehensweisen anwenden, Qualität und Änderungen steuern und Projekte mit Lessons Learned abschließen.
