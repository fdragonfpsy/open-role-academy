id: variance-analysis-performance-management
title:
  en: Variance analysis and performance management
  de: Abweichungsanalyse und Performance-Steuerung
description:
  en: >-
    Compare plan, actual and prior-period figures, split variances into price, volume and mix effects, find root causes with the business and agree corrective actions.
  de: >-
    Plan-, Ist- und Vorperiodenwerte vergleichen, Abweichungen in Preis-, Mengen- und Mixeffekte zerlegen, Ursachen mit dem Fachbereich klären und Gegenmaßnahmen vereinbaren.
prerequisites: [budgeting-forecasting, financial-analysis-kpis]
track: role
frameworkRefs:
