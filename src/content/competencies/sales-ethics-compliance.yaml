id: sales-ethics-compliance
title:
  en: Sales ethics and compliance (Germany/EU)
  de: Vertriebsethik und Compliance (Deutschland/EU)
description:
  en: >-
    Sell fairly and lawfully in Germany and the EU: honest claims, fair commercial practices (UWG), consumer protection basics, handling contact data under the GDPR for B2B and B2C outreach, and avoiding conflicts of interest and improper benefits — and knowing when to involve legal or compliance.
  de: >-
    In Deutschland und der EU fair und rechtmäßig verkaufen: ehrliche Aussagen, lauterer Wettbewerb (UWG), Grundlagen des Verbraucherschutzes, Umgang mit Kontaktdaten nach DSGVO bei B2B- und B2C-Ansprache sowie Vermeidung von Interessenkonflikten und unzulässigen Vorteilen – und wissen, wann Recht oder Compliance einzubinden sind.
prerequisites: [information-security-basics]
track: role
frameworkRefs:
