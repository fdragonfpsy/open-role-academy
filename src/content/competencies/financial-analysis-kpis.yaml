id: financial-analysis-kpis
title:
  en: Financial analysis and KPIs
  de: Finanzanalyse und Kennzahlen
description:
  en: >-
    Analyse financial statements with ratios for profitability, liquidity and capital structure,
    build simple KPI dashboards and communicate findings to non-finance colleagues.
  de: >-
    Jahresabschlüsse mit Kennzahlen zu Rentabilität, Liquidität und Kapitalstruktur analysieren,
    einfache Kennzahlen-Dashboards aufbauen und Ergebnisse für Kolleginnen und Kollegen ohne
    Finanzhintergrund verständlich aufbereiten.
prerequisites: [financial-statements-reporting, working-with-data]
track: role
