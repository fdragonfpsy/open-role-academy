id: tax-basics
title:
  en: Business tax basics (Germany/EU)
  de: Steuerliche Grundlagen für Unternehmen (Deutschland/EU)
description:
  en: >-
    Apply the basics of value-added tax in Germany and the EU (input and output tax, invoice
    requirements, cross-border supplies) and know the main business taxes, filing duties and when to
    involve tax advisors.
  de: >-
    Die Grundlagen der Umsatzsteuer in Deutschland und der EU anwenden (Vor- und Umsatzsteuer,
    Rechnungsanforderungen, grenzüberschreitende Leistungen) und die wichtigsten
    Unternehmenssteuern, Meldepflichten und den richtigen Zeitpunkt für steuerliche Beratung kennen.
prerequisites: [bookkeeping-fundamentals]
track: role
frameworkRefs:
