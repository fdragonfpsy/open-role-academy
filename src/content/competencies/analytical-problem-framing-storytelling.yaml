id: analytical-problem-framing-storytelling
title:
  en: Analytical problem framing and storytelling
  de: Analytische Problemformulierung und Storytelling
description:
  en: >-
    Turn business questions into answerable analytical questions and hypotheses, choose a sensible approach, and communicate findings, limits and recommendations in a clear narrative for the audience.
  de: >-
    Geschäftsfragen in beantwortbare analytische Fragen und Hypothesen übersetzen, einen sinnvollen Ansatz wählen und Ergebnisse, Grenzen und Empfehlungen in einer klaren Geschichte für die Zielgruppe vermitteln.
prerequisites: [data-analytics-fundamentals, communication-collaboration]
track: role
