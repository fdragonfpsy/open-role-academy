id: team-building-psychological-safety
title:
  en: Team building and psychological safety
  de: Teamentwicklung und psychologische Sicherheit
description:
  en: >-
    Build a team that works well together: clarify roles and working agreements, understand typical stages of team development, create psychological safety so people can raise concerns and mistakes, and strengthen cooperation, including in remote or hybrid teams.
  de: >-
    Ein Team aufbauen, das gut zusammenarbeitet: Rollen und Arbeitsvereinbarungen klären, typische Phasen der Teamentwicklung verstehen, psychologische Sicherheit schaffen, damit Bedenken und Fehler angesprochen werden, und die Zusammenarbeit stärken, auch in Remote- und Hybridteams.
prerequisites: [leadership-fundamentals-role-transition]
track: role
frameworkRefs:
