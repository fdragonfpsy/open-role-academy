id: information-security-basics
title:
  en: Information security basics
  de: Grundlagen der Informationssicherheit
description:
  en: >-
    Protect information and accounts in everyday work: understand confidentiality, integrity and
    availability, recognise phishing and social engineering, use strong authentication, handle
    data carefully and report security incidents quickly.
  de: >-
    Informationen und Konten im Arbeitsalltag schützen: Vertraulichkeit, Integrität und
    Verfügbarkeit verstehen, Phishing und Social Engineering erkennen, sichere Anmeldeverfahren
    nutzen, sorgfältig mit Daten umgehen und Sicherheitsvorfälle schnell melden.
prerequisites: []
track: core
frameworkRefs:
  - framework: DigComp
    uri: https://joint-research-centre.ec.europa.eu/scientific-activities-z/education-and-training/digital-transformation-education/digital-competence-framework-citizens-digcomp_en
    label: "DigComp 2.2 — Competence area 4: Safety (4.1 Protecting devices, 4.2 Protecting personal data and privacy)"
