id: investment-appraisal-capital-budgeting
title:
  en: Investment appraisal and capital budgeting
  de: Investitionsrechnung und Kapitalbudgetierung
description:
  en: >-
    Evaluate investments with payback, net present value and internal rate of return, build business cases, run sensitivity and scenario analyses and track benefits after approval.
  de: >-
    Investitionen mit Amortisationsdauer, Kapitalwert und internem Zinsfuß bewerten, Business Cases erstellen, Sensitivitäts- und Szenarioanalysen durchführen und den Nutzen nach der Freigabe nachverfolgen.
prerequisites: [business-finance-fundamentals, cost-accounting]
track: role
