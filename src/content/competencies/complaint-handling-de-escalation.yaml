id: complaint-handling-de-escalation
title:
  en: Complaint handling and de-escalation
  de: Beschwerdemanagement und Deeskalation
description:
  en: >-
    Handle complaints and upset customers constructively: stay calm, acknowledge the issue, investigate, offer a fair solution within your authority, de-escalate tense situations, know when to escalate, and document the case.
  de: >-
    Beschwerden und verärgerte Kundschaft konstruktiv handhaben: ruhig bleiben, das Anliegen anerkennen, Ursachen klären, im eigenen Entscheidungsrahmen eine faire Lösung anbieten, angespannte Situationen deeskalieren, rechtzeitig eskalieren und den Fall dokumentieren.
prerequisites: [customer-needs-problem-solving]
track: role
