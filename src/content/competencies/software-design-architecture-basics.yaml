id: software-design-architecture-basics
title:
  en: Software design and architecture basics
  de: Grundlagen von Softwareentwurf und -architektur
description:
  en: >-
    Structure software so it stays understandable and changeable: modularity, separation of concerns, common design patterns, layers and components, and recording design decisions.
  de: >-
    Software so strukturieren, dass sie verständlich und änderbar bleibt: Modularität, Trennung von Zuständigkeiten, gängige Entwurfsmuster, Schichten und Komponenten sowie das Festhalten von Entwurfsentscheidungen.
prerequisites: [programming-fundamentals-problem-solving]
track: role
