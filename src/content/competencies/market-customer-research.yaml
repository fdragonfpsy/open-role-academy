id: market-customer-research
title:
  en: Market and customer research
  de: Markt- und Kundenforschung
description:
  en: >-
    Find out what the market and customers need: define research questions, use desk and primary research (surveys, interviews), read competitor and trend information, and turn findings into usable insights.
  de: >-
    Herausfinden, was Markt und Kundschaft brauchen: Forschungsfragen formulieren, Sekundär- und Primärforschung (Umfragen, Interviews) nutzen, Wettbewerbs- und Trendinformationen auswerten und Erkenntnisse nutzbar machen.
prerequisites: [marketing-fundamentals-strategy]
track: role
