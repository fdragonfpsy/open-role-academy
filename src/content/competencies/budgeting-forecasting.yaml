id: budgeting-forecasting
title:
  en: Budgeting and forecasting
  de: Budgetierung und Forecasting
description:
  en: >-
    Build and maintain budgets with business stakeholders, create rolling forecasts, analyse plan-
    versus-actual variances and explain their drivers.
  de: >-
    Budgets gemeinsam mit Fachbereichen erstellen und pflegen, rollierende Forecasts aufbauen, Plan-
    Ist-Abweichungen analysieren und ihre Ursachen erklären.
prerequisites: [business-finance-fundamentals, working-with-data]
track: role
