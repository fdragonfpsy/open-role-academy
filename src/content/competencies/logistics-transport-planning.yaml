id: logistics-transport-planning
title:
  en: Logistics and transport planning
  de: Logistik und Transportplanung
description:
  en: >-
    Plan inbound and outbound transport, choose transport modes and carriers, understand delivery terms (Incoterms) and shipping documents at topic level, and monitor delivery performance.
  de: >-
    Eingehende und ausgehende Transporte planen, Verkehrsträger und Frachtführer auswählen, Lieferbedingungen (Incoterms) und Versanddokumente auf Themenebene verstehen und die Liefertreue überwachen.
prerequisites: [inventory-warehouse-management]
track: role
frameworkRefs:
