id: ticketing-knowledge-base
title:
  en: Ticketing and knowledge base
  de: Ticketsystem und Wissensdatenbank
description:
  en: >-
    Work with a customer service ticketing system and knowledge base: capture and categorise requests, set priority and status, write clear case notes, find and write helpful knowledge articles, and keep records tidy.
  de: >-
    Mit einem Ticketsystem und einer Wissensdatenbank im Kundenservice arbeiten: Anfragen erfassen und kategorisieren, Priorität und Status setzen, klare Fallnotizen schreiben, hilfreiche Wissensartikel finden und verfassen und Daten sauber halten.
prerequisites: [customer-service-fundamentals, digital-ai-literacy]
track: role
