id: sales-process-pipeline
title:
  en: Sales process and pipeline
  de: Vertriebsprozess und Pipeline
description:
  en: >-
    Understand the stages of a sales process, how a pipeline is structured, which criteria move a deal to the next stage, and how to set sales goals and plan activities to reach them.
  de: >-
    Die Phasen eines Vertriebsprozesses, den Aufbau einer Pipeline und die Kriterien für den Übergang eines Deals in die nächste Phase verstehen sowie Verkaufsziele setzen und Aktivitäten planen, um sie zu erreichen.
