    Softwarekomponenten und Dienste über Schnittstellen verbinden: Funktionsweise von APIs, HTTP und Web-APIs, Datenformate wie JSON, Grundlagen der Authentifizierung, Fehlerbehandlung, Versionierung und Dokumentation.
