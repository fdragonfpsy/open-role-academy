id: apis-integration
title:
  en: APIs and system integration
  de: APIs und Systemintegration
description:
  en: >-
    Connect software components and services through interfaces: how APIs work, HTTP and web APIs, data formats such as JSON, authentication basics, error handling, versioning and documentation.
