id: account-management-upselling
title:
  en: Account management and upselling
  de: Kundenbetreuung und Zusatzverkauf
description:
  en: >-
    Build long-term customer relationships: plan account development, follow up after the sale, identify upsell and cross-sell opportunities, handle complaints and renewals, and keep customers successful.
  de: >-
    Langfristige Kundenbeziehungen aufbauen: Kundenentwicklung planen, nach dem Verkauf nachfassen, Chancen für Upselling und Cross-Selling erkennen, Beschwerden und Vertragsverlängerungen handhaben und Kundschaft zum Erfolg führen.
prerequisites: [closing-contract-handover]
track: role
