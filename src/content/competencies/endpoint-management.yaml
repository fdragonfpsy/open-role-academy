id: endpoint-management
title:
  en: Endpoint and workplace device management
  de: Verwaltung von Endgeräten und Arbeitsplätzen
description:
  en: >-
    Set up, maintain and retire laptops, desktops, mobile devices and peripherals: operating system
    basics, software installation and updates, patching, device configuration and security
    baselines, and centralised device management.
  de: >-
    Laptops, Desktop-PCs, Mobilgeräte und Peripherie einrichten, pflegen und außer Betrieb nehmen:
    Grundlagen von Betriebssystemen, Softwareinstallation und Updates, Patches, Gerätekonfiguration
    und Sicherheitsvorgaben sowie zentrale Geräteverwaltung.
prerequisites: [digital-ai-literacy]
track: role
