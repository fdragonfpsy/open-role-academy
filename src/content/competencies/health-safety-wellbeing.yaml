id: health-safety-wellbeing
title:
  en: Occupational health, safety and well-being
  de: Arbeitsschutz, Gesundheit und Wohlbefinden
description:
  en: >-
    Know the employer duties for safe and healthy work, support risk assessments including
    psychological stress, coordinate with occupational safety and health experts, and promote well-
    being and return-to-work measures.
  de: >-
    Die Pflichten von Arbeitgebern für sicheres und gesundes Arbeiten kennen,
    Gefährdungsbeurteilungen einschließlich psychischer Belastungen unterstützen, mit Fachleuten für
    Arbeitssicherheit und Arbeitsmedizin zusammenarbeiten sowie Wohlbefinden und Wiedereingliederung
    fördern.
prerequisites: []
track: role
