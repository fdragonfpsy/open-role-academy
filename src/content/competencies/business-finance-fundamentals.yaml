id: business-finance-fundamentals
title:
  en: Business and finance fundamentals
  de: Betriebswirtschaftliche und finanzielle Grundlagen
description:
  en: >-
    Understand how a company creates value and earns money: revenue, costs and profit, budgets,
    the basic financial statements, key performance indicators, and how your own role contributes
    to business results.
  de: >-
    Verstehen, wie ein Unternehmen Wert schafft und Geld verdient: Umsatz, Kosten und Gewinn,
    Budgets, die grundlegenden Finanzberichte, Kennzahlen und wie die eigene Rolle zum
    Unternehmensergebnis beiträgt.
prerequisites: []
