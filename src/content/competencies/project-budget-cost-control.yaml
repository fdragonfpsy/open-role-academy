id: project-budget-cost-control
title:
  en: Project budget and cost control
  de: Projektbudget und Kostensteuerung
description:
  en: >-
    Estimate project costs, build a budget with contingency, track actual against planned costs, forecast the outcome, report variances and decide on corrective actions.
  de: >-
    Projektkosten schätzen, ein Budget mit Reserve aufstellen, Ist- und Plankosten verfolgen, das Ergebnis prognostizieren, Abweichungen berichten und Gegenmaßnahmen entscheiden.
prerequisites: [work-breakdown-scheduling, business-finance-fundamentals]
track: role
