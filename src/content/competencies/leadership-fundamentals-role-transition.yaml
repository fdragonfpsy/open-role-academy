id: leadership-fundamentals-role-transition
title:
  en: Leadership fundamentals and role transition
  de: Führungsgrundlagen und Rollenwechsel
description:
  en: >-
    Understand what changes when moving from expert to team lead: leadership versus management, the lead's responsibilities, leadership styles and when to use them, setting expectations, and building credibility in the first weeks.
  de: >-
    Verstehen, was sich beim Wechsel von der Fachkraft zur Teamleitung ändert: Führung und Management, die Verantwortung der Führungskraft, Führungsstile und ihr situativer Einsatz, Erwartungen klären und Glaubwürdigkeit in den ersten Wochen aufbauen.
prerequisites: [communication-collaboration]
track: role
