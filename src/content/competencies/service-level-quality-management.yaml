id: service-level-quality-management
title:
  en: Service levels and quality management
  de: Service-Level und Qualitätsmanagement
description:
  en: >-
    Measure and steer service quality: service level agreements, response and resolution times, common metrics such as CSAT, NPS and first-contact resolution, quality monitoring and coaching, and staffing and workload basics.
  de: >-
    Servicequalität messen und steuern: Service-Level-Vereinbarungen, Reaktions- und Lösungszeiten, gängige Kennzahlen wie CSAT, NPS und Erstlösungsquote, Qualitätssicherung und Coaching sowie Grundlagen der Personal- und Lastplanung.
prerequisites: [ticketing-knowledge-base, working-with-data]
track: role
