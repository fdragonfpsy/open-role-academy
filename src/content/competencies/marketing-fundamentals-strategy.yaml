id: marketing-fundamentals-strategy
title:
  en: Marketing fundamentals and strategy
  de: Marketing-Grundlagen und -Strategie
description:
  en: >-
    Understand what marketing does in a company: the marketing mix, how marketing goals follow from business goals, and how a simple marketing strategy and plan are put together and implemented.
  de: >-
    Verstehen, welche Aufgabe Marketing im Unternehmen hat: Marketing-Mix, Ableitung von Marketingzielen aus Unternehmenszielen sowie Aufbau und Umsetzung einer einfachen Marketingstrategie und eines Marketingplans.
