id: compliance-management-governance
title:
  en: Compliance management and corporate governance
  de: Compliance-Management und Corporate Governance
description:
  en: >-
    Understand how a compliance management system works: identifying legal and internal requirements, policies and codes of conduct, training and communication, monitoring and reporting, handling violations, and how governance bodies, roles and business ethics support a compliant culture (EU/Germany context).
  de: >-
    Verstehen, wie ein Compliance-Management-System funktioniert: rechtliche und interne Anforderungen erfassen, Richtlinien und Verhaltenskodizes, Schulung und Kommunikation, Überwachung und Berichterstattung, Umgang mit Verstößen sowie die Rolle von Governance-Gremien, Verantwortlichkeiten und Unternehmensethik für eine regelkonforme Kultur (Kontext EU/Deutschland).
prerequisites: [legal-foundations-sources-of-law]
track: role
