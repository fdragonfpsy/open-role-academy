id: recruitment-selection
title:
  en: Recruitment and selection
  de: Personalgewinnung und -auswahl
description:
  en: >-
    Define requirements with hiring managers, write inclusive job ads, choose sourcing channels,
    screen applications fairly, run structured interviews and make well-documented, non-
    discriminatory selection decisions.
  de: >-
    Anforderungen mit Führungskräften klären, inklusive Stellenanzeigen schreiben, Kanäle für die
    Ansprache wählen, Bewerbungen fair sichten, strukturierte Interviews führen und gut
    dokumentierte, diskriminierungsfreie Auswahlentscheidungen treffen.
prerequisites: [employment-law-basics]
track: role
frameworkRefs:
