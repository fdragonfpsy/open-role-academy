id: secure-coding-basics
title:
  en: Secure coding basics
  de: Grundlagen der sicheren Softwareentwicklung
description:
  en: >-
    Write software that resists common attacks: input validation, injection and cross-site scripting, authentication and secrets handling, dependency risks, least privilege and security testing.
  de: >-
    Software schreiben, die gängigen Angriffen standhält: Eingabevalidierung, Injection und Cross-Site-Scripting, Authentifizierung und Umgang mit Geheimnissen, Risiken durch Abhängigkeiten, minimale Rechte und Sicherheitstests.
prerequisites: [information-security-basics, programming-fundamentals-problem-solving]
track: role
