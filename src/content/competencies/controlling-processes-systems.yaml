id: controlling-processes-systems
title:
  en: Controlling processes and systems
  de: Controlling-Prozesse und -Systeme
description:
  en: >-
    Run the planning, forecasting and reporting calendar, keep master data and cost-centre structures consistent, and use ERP, planning and reporting tools with clear data lineage and documented definitions.
  de: >-
    Den Planungs-, Forecast- und Berichtskalender steuern, Stammdaten und Kostenstellenstrukturen konsistent halten sowie ERP-, Planungs- und Reporting-Werkzeuge mit nachvollziehbarer Datenherkunft und dokumentierten Definitionen nutzen.
prerequisites: [working-with-data, cost-accounting]
track: role
