id: data-visualization-dashboards
title:
  en: Data visualisation and dashboards
  de: Datenvisualisierung und Dashboards
description:
  en: >-
    Choose suitable chart types, design clear and accessible visualisations, avoid misleading scales and clutter, and build dashboards that let users answer their questions quickly.
  de: >-
    Passende Diagrammtypen wählen, klare und barrierefreie Visualisierungen gestalten, irreführende Skalen und Überladung vermeiden und Dashboards aufbauen, mit denen Nutzende ihre Fragen schnell beantworten können.
prerequisites: [data-analytics-fundamentals]
track: role
