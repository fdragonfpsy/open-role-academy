id: business-intelligence-reporting
title:
  en: Business intelligence and reporting
  de: Business Intelligence und Reporting
description:
  en: >-
    Understand BI building blocks (data warehouse, data models, metrics and dimensions), define consistent KPIs, build and maintain recurring reports, and keep report definitions documented and trusted.
  de: >-
    Bausteine der Business Intelligence (Data Warehouse, Datenmodelle, Kennzahlen und Dimensionen) verstehen, einheitliche KPIs definieren, wiederkehrende Berichte erstellen und pflegen und Berichtsdefinitionen dokumentiert und vertrauenswürdig halten.
prerequisites: [sql-data-querying, data-visualization-dashboards]
track: role
