id: personnel-administration
title:
  en: Personnel administration
  de: Personaladministration
description:
  en: >-
    Maintain accurate personnel records and processes: contracts and changes, absence and leave
    management, time recording, certificates and documents, HR systems and retention periods.
  de: >-
    Personaldaten und -prozesse korrekt pflegen: Verträge und Vertragsänderungen, Abwesenheits- und
    Urlaubsverwaltung, Zeiterfassung, Bescheinigungen und Dokumente, HR-Systeme und
    Aufbewahrungsfristen.
prerequisites: [employment-law-basics]
track: role
