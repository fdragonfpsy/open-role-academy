id: databases-data-modelling-basics
title:
  en: Databases and data modelling basics
  de: Grundlagen von Datenbanken und Datenmodellierung
description:
  en: >-
    Store and retrieve application data reliably: relational and NoSQL databases, modelling entities and relationships, keys and indexes, transactions, and using a database from application code.
  de: >-
    Anwendungsdaten zuverlässig speichern und abrufen: relationale und NoSQL-Datenbanken, Modellierung von Entitäten und Beziehungen, Schlüssel und Indizes, Transaktionen und die Nutzung einer Datenbank aus dem Anwendungscode.
prerequisites: [sql-data-querying]
track: role
