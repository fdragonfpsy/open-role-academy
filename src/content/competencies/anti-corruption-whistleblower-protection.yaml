id: anti-corruption-whistleblower-protection
title:
  en: Anti-corruption and whistleblower protection (EU/Germany)
  de: Korruptionsprävention und Hinweisgeberschutz (EU/Deutschland)
description:
  en: >-
    Recognise corruption and bribery risks (gifts, hospitality, conflicts of interest, third parties) and set up preventive measures at topic level. Understand the purpose of the EU whistleblower directive and the German Whistleblower Protection Act (HinSchG): internal reporting channels, confidentiality, protection from retaliation and handling reports.
  de: >-
    Korruptions- und Bestechungsrisiken (Geschenke, Einladungen, Interessenkonflikte, Dritte) erkennen und Präventionsmaßnahmen auf Themenebene gestalten. Zweck der EU-Hinweisgeberrichtlinie und des deutschen Hinweisgeberschutzgesetzes (HinSchG) verstehen: interne Meldekanäle, Vertraulichkeit, Schutz vor Repressalien und Umgang mit Meldungen.
prerequisites: [compliance-management-governance]
track: role
frameworkRefs:
