id: brand-messaging
title:
  en: Brand and messaging
  de: Marke und Botschaften
description:
  en: >-
    Describe what a brand stands for: brand identity, tone of voice, value proposition and key messages, and keep them consistent across channels and materials.
  de: >-
    Beschreiben, wofür eine Marke steht: Markenidentität, Tonalität, Nutzenversprechen und Kernbotschaften – und diese über Kanäle und Materialien hinweg konsistent halten.
