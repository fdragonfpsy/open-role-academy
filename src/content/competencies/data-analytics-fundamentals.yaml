id: data-analytics-fundamentals
title:
  en: Data analytics fundamentals
  de: Grundlagen der Datenanalyse
description:
  en: >-
    Understand the analytics lifecycle from question to decision, the types of analysis (descriptive, diagnostic, predictive, prescriptive), data types and structures, and the typical tools and roles in an analytics team.
  de: >-
    Den Analytics-Ablauf von der Fragestellung bis zur Entscheidung verstehen, die Arten der Analyse (deskriptiv, diagnostisch, prädiktiv, präskriptiv), Datentypen und -strukturen sowie typische Werkzeuge und Rollen in einem Analytics-Team kennen.
prerequisites: [working-with-data, digital-ai-literacy]
track: role
