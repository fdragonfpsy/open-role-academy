id: employee-relations-conflict
title:
  en: Employee relations and conflict resolution
  de: Mitarbeiterbeziehungen und Konfliktlösung
description:
  en: >-
    Handle employee concerns and conflicts fairly: listen, clarify facts, mediate between parties,
    follow due process for complaints and disciplinary matters, and cooperate constructively with
    employee representatives.
  de: >-
    Anliegen und Konflikte von Mitarbeitenden fair bearbeiten: zuhören, Sachverhalte klären,
    zwischen Beteiligten vermitteln, bei Beschwerden und arbeitsrechtlichen Maßnahmen ein geordnetes
    Verfahren einhalten und konstruktiv mit der Arbeitnehmervertretung zusammenarbeiten.
prerequisites: [employment-law-basics, communication-collaboration]
track: role
frameworkRefs:
