id: contract-law-basics
title:
  en: Contract law basics (Germany/EU)
  de: Grundlagen des Vertragsrechts (Deutschland/EU)
description:
  en: >-
    Know how contracts come into being and what they contain in Germany and the EU: offer and acceptance, typical contract types, general terms and conditions, liability and performance disruptions at topic level, and how to review and draft simple clauses with a checklist.
  de: >-
    Wissen, wie Verträge in Deutschland und der EU zustande kommen und was sie enthalten: Angebot und Annahme, typische Vertragsarten, Allgemeine Geschäftsbedingungen, Haftung und Leistungsstörungen auf Themenebene sowie das Prüfen und Entwerfen einfacher Klauseln mit einer Checkliste.
prerequisites: [legal-foundations-sources-of-law]
track: role
