id: statistics-fundamentals
title:
  en: Statistics fundamentals
  de: Grundlagen der Statistik
description:
  en: >-
    Use descriptive statistics, distributions, sampling, correlation and basic hypothesis testing and confidence intervals, and interpret results carefully, including the difference between correlation and causation.
  de: >-
    Deskriptive Statistik, Verteilungen, Stichproben, Korrelation sowie grundlegende Hypothesentests und Konfidenzintervalle anwenden und Ergebnisse sorgfältig interpretieren, einschließlich des Unterschieds zwischen Korrelation und Kausalität.
prerequisites: [data-analytics-fundamentals]
track: role
