id: inventory-warehouse-management
title:
  en: Inventory and warehouse management
  de: Bestands- und Lagerverwaltung
description:
  en: >-
    Control stock levels, reorder points and safety stock, organise warehouse processes (receiving, storage, picking), run stock counts and understand inventory valuation and key figures at a basic level.
  de: >-
    Bestände, Meldebestände und Sicherheitsbestände steuern, Lagerprozesse (Wareneingang, Lagerung, Kommissionierung) organisieren, Inventuren durchführen und Bestandsbewertung sowie Kennzahlen auf Grundniveau verstehen.
prerequisites: [procurement-fundamentals-p2p]
track: role
