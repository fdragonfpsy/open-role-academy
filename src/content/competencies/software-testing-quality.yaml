id: software-testing-quality
title:
  en: Software testing and quality
  de: Softwaretests und Qualitätssicherung
description:
  en: >-
    Verify that software works as intended: test levels, unit and integration tests, test design, test automation, coverage and maintainability as quality attributes.
  de: >-
    Prüfen, ob Software wie vorgesehen funktioniert: Teststufen, Unit- und Integrationstests, Testentwurf, Testautomatisierung, Testabdeckung und Wartbarkeit als Qualitätsmerkmale.
prerequisites: [programming-fundamentals-problem-solving]
track: role
