id: stakeholder-management-communication
title:
  en: Stakeholder management and project communication
  de: Stakeholder-Management und Projektkommunikation
description:
  en: >-
    Identify stakeholders and their interests and influence, plan communication, run effective meetings, report status clearly, manage expectations and negotiate agreements.
  de: >-
    Stakeholder mit ihren Interessen und ihrem Einfluss identifizieren, Kommunikation planen, wirksame Meetings leiten, Status klar berichten, Erwartungen steuern und Vereinbarungen aushandeln.
prerequisites: [project-initiation-business-case, communication-collaboration]
track: role
