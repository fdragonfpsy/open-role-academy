id: networking-fundamentals
title:
  en: Networking fundamentals
  de: Netzwerkgrundlagen
description:
  en: >-
    Understand how devices communicate: IP addressing and subnets, DHCP and DNS, routing and
    switching basics, Wi-Fi and VPN, common ports and protocols, and how to use basic network
    diagnostic tools.
  de: >-
    Verstehen, wie Geräte miteinander kommunizieren: IP-Adressen und Subnetze, DHCP und DNS,
    Grundlagen von Routing und Switching, WLAN und VPN, gängige Ports und Protokolle sowie der
    Einsatz einfacher Netzwerk-Diagnosewerkzeuge.
prerequisites: []
track: role
