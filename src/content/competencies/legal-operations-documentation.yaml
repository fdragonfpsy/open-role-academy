id: legal-operations-documentation
title:
  en: Legal operations and documentation
  de: Legal Operations und Dokumentation
description:
  en: >-
    Organise the day-to-day work of a legal or compliance function: intake and prioritisation of requests, matter and deadline tracking, contract and document management with versioning and retention, templates and playbooks, confidentiality, and simple metrics for the function.
  de: >-
    Die tägliche Arbeit einer Rechts- oder Compliance-Funktion organisieren: Annahme und Priorisierung von Anfragen, Fall- und Fristenverfolgung, Vertrags- und Dokumentenmanagement mit Versionierung und Aufbewahrung, Vorlagen und Playbooks, Vertraulichkeit sowie einfache Kennzahlen für die Funktion.
prerequisites: [legal-foundations-sources-of-law]
track: role
