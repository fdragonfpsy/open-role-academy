id: tendering-rfx-contracting
title:
  en: Tendering, RFx and contracting
  de: Ausschreibung, RFx und Vertragsgestaltung
description:
  en: >-
    Prepare requests for information, quotation and proposal, evaluate offers transparently, understand the basic elements of purchase contracts and know, at topic level, why public buyers in the EU follow formal procurement rules.
  de: >-
    Anfragen (RFI, RFQ, RFP) vorbereiten, Angebote transparent bewerten, die Grundbausteine von Kaufverträgen kennen und auf Themenebene verstehen, warum öffentliche Auftraggeber in der EU förmlichen Vergaberegeln folgen.
prerequisites: [supplier-selection-evaluation]
track: role
