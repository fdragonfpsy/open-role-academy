id: segmentation-targeting-positioning
title:
  en: Segmentation, targeting and positioning
  de: Segmentierung, Zielgruppenauswahl und Positionierung
description:
  en: >-
    Divide a market into meaningful segments, choose target groups, describe them with personas, and position an offer clearly against alternatives.
  de: >-
    Einen Markt in sinnvolle Segmente einteilen, Zielgruppen auswählen, sie mit Personas beschreiben und ein Angebot gegenüber Alternativen klar positionieren.
prerequisites: [market-customer-research]
track: role
