id: machine-learning-basics-ai-analytics
title:
  en: Machine learning basics and AI in analytics
  de: Grundlagen des maschinellen Lernens und KI in der Analytik
description:
  en: >-
    Understand supervised and unsupervised learning, training and test data, overfitting and basic evaluation metrics, and the limits, bias risks and responsible use of machine learning and generative AI in analytics work.
  de: >-
    Überwachtes und unüberwachtes Lernen, Trainings- und Testdaten, Overfitting und grundlegende Bewertungsmetriken verstehen sowie Grenzen, Verzerrungsrisiken und verantwortungsvollen Einsatz von maschinellem Lernen und generativer KI in der Analytik kennen.
prerequisites: [statistics-fundamentals, digital-ai-literacy]
track: role
