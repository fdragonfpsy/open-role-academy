id: cost-accounting
title:
  en: Cost accounting
  de: Kosten- und Leistungsrechnung
description:
  en: >-
    Classify costs (fixed and variable, direct and indirect), use cost centres and cost objects,
    calculate contribution margins and support pricing and make-or-buy decisions.
  de: >-
    Kosten einordnen (fix und variabel, Einzel- und Gemeinkosten), Kostenstellen und Kostenträger
    nutzen, Deckungsbeiträge berechnen und Preis- sowie Make-or-buy-Entscheidungen unterstützen.
prerequisites: [bookkeeping-fundamentals]
track: role
