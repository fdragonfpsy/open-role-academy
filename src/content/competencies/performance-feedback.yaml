id: performance-feedback
title:
  en: Performance management and feedback
  de: Leistungsmanagement und Feedback
description:
  en: >-
    Support goal setting, regular check-ins and appraisal processes; coach managers in giving
    specific, fair feedback; and reduce common rating biases.
  de: >-
    Zielvereinbarungen, regelmäßige Gespräche und Beurteilungsprozesse unterstützen, Führungskräfte
    darin begleiten, konkretes und faires Feedback zu geben, und typische Beurteilungsfehler
    verringern.
prerequisites: [communication-collaboration]
track: role
frameworkRefs:
