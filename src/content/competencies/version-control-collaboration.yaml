id: version-control-collaboration
title:
  en: Version control and collaboration
  de: Versionsverwaltung und Zusammenarbeit
description:
  en: >-
    Track and share changes with version control: commits, branches, merging, resolving conflicts, pull or merge requests, and team workflows for working on shared code.
  de: >-
    Änderungen mit Versionsverwaltung nachverfolgen und teilen: Commits, Branches, Zusammenführen, Konflikte lösen, Pull bzw. Merge Requests und Teamabläufe für die Arbeit an gemeinsamem Code.
prerequisites: [programming-fundamentals-problem-solving]
track: role
