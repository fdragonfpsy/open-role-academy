    uri: http://data.europa.eu/esco/skill/0d6714c6-720e-4985-9791-5ab85d28da79
    label: gather data
  - framework: ESCO
    uri: http://data.europa.eu/esco/skill/a80fb090-63f4-4b05-83a5-2f090deb7757
    label: manage data collection systems
