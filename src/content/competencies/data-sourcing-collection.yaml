id: data-sourcing-collection
title:
  en: Data sourcing and collection
  de: Datenbeschaffung und -erhebung
description:
  en: >-
    Identify relevant data sources, collect and combine data from files, databases, APIs and surveys, document origin and meaning of fields, and judge whether data is fit for the question at hand.
  de: >-
    Relevante Datenquellen identifizieren, Daten aus Dateien, Datenbanken, APIs und Befragungen erheben und zusammenführen, Herkunft und Bedeutung von Feldern dokumentieren und beurteilen, ob Daten zur Fragestellung passen.
prerequisites: [data-analytics-fundamentals]
track: role
frameworkRefs:
