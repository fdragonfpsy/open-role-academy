id: communication-collaboration
title:
  en: Communication and collaboration
  de: Kommunikation und Zusammenarbeit
description:
  en: >-
    Communicate clearly in writing and in conversation, give and receive feedback, work
    effectively in teams, run and take part in meetings, and choose suitable digital channels
    and tools for collaboration.
  de: >-
    Schriftlich und im Gespräch klar kommunizieren, Feedback geben und annehmen, wirksam im Team
    arbeiten, Besprechungen leiten und daran teilnehmen sowie passende digitale Kanäle und
    Werkzeuge für die Zusammenarbeit wählen.
prerequisites: []
