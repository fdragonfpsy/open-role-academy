id: incident-request-handling
title:
  en: Incident and request handling
  de: Bearbeitung von Störungen und Anfragen
description:
  en: >-
    Log, categorise and prioritise tickets by impact and urgency, keep users informed, escalate
    correctly, meet service levels, close tickets with a clear resolution and recognise recurring
    incidents that need problem management.
  de: >-
    Tickets erfassen, kategorisieren und nach Auswirkung und Dringlichkeit priorisieren, Nutzende
    auf dem Laufenden halten, richtig eskalieren, Service Levels einhalten, Tickets mit klarer
    Lösung schließen und wiederkehrende Störungen erkennen, die ein Problem-Management brauchen.
prerequisites: [it-service-management]
track: role
frameworkRefs:
