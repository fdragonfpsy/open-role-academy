id: regulatory-monitoring-legal-research
title:
  en: Regulatory monitoring and legal research
  de: Regulatory Monitoring und Rechtsrecherche
description:
  en: >-
    Find, evaluate and track legal sources: use official EU and German legal databases, distinguish primary from secondary sources, check that a text is current, monitor upcoming regulatory changes, assess their relevance for the business and summarise findings in a short, traceable legal memo.
  de: >-
    Rechtsquellen finden, bewerten und verfolgen: amtliche EU- und deutsche Rechtsdatenbanken nutzen, Primär- von Sekundärquellen unterscheiden, die Aktualität eines Textes prüfen, anstehende Rechtsänderungen beobachten, ihre Relevanz für das Unternehmen einschätzen und Ergebnisse in einem kurzen, nachvollziehbaren Rechtsvermerk zusammenfassen.
prerequisites: [legal-foundations-sources-of-law]
track: role
