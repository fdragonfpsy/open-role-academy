id: bookkeeping-fundamentals
title:
  en: Bookkeeping fundamentals
  de: Grundlagen der Buchführung
description:
  en: >-
    Record business transactions correctly with double-entry bookkeeping: accounts and the chart of
    accounts, debit and credit, journal entries, supporting documents and the principles of orderly
    bookkeeping (Germany: GoB).
  de: >-
    Geschäftsvorfälle mit doppelter Buchführung korrekt erfassen: Konten und Kontenrahmen, Soll und
    Haben, Buchungssätze, Belege und die Grundsätze ordnungsmäßiger Buchführung (Deutschland: GoB).
prerequisites: [business-finance-fundamentals]
track: role
