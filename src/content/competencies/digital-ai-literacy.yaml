id: digital-ai-literacy
title:
  en: Digital and AI literacy
  de: Digitale Kompetenz und KI-Kompetenz
description:
  en: >-
    Use common workplace software confidently, search for and critically evaluate information,
    manage files and digital content, and use AI tools (such as chatbots and writing assistants)
    responsibly — knowing their strengths, limits and risks, and checking their output.
  de: >-
    Gängige Arbeitssoftware sicher nutzen, Informationen suchen und kritisch bewerten, Dateien und
    digitale Inhalte verwalten sowie KI-Werkzeuge (z. B. Chatbots und Schreibassistenten)
    verantwortungsvoll einsetzen – mit Wissen über Stärken, Grenzen und Risiken und mit Prüfung
    der Ergebnisse.
prerequisites: []
track: core
