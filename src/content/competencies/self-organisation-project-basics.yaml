id: self-organisation-project-basics
title:
  en: Self-organisation and project basics
  de: Selbstorganisation und Projektgrundlagen
description:
  en: >-
    Plan and prioritise your own work, manage time and tasks, set clear goals, and apply basic
    project methods — scope, milestones, responsibilities, risks and simple agile practices — to
    small projects.
  de: >-
    Die eigene Arbeit planen und priorisieren, Zeit und Aufgaben steuern, klare Ziele setzen und
    grundlegende Projektmethoden – Umfang, Meilensteine, Verantwortlichkeiten, Risiken und
    einfache agile Praktiken – in kleinen Projekten anwenden.
prerequisites: []
track: core
