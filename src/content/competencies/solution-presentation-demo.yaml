id: solution-presentation-demo
title:
  en: Solution presentation and demo
  de: Lösungspräsentation und Demo
description:
  en: >-
    Present products and services in terms of customer benefit: structure a persuasive presentation, tailor a demo to the identified needs, argue with facts and references, and handle questions confidently.
  de: >-
    Produkte und Dienstleistungen nutzenorientiert präsentieren: eine überzeugende Präsentation aufbauen, eine Demo auf den ermittelten Bedarf zuschneiden, mit Fakten und Referenzen argumentieren und Rückfragen sicher beantworten.
prerequisites: [discovery-needs-analysis]
track: role
