id: negotiation-supplier-relationships
title:
  en: Negotiation and supplier relationships
  de: Verhandlung und Lieferantenbeziehungen
description:
  en: >-
    Prepare purchasing negotiations (interests, alternatives, limits), negotiate terms beyond price, and build and manage constructive, long-term supplier relationships including escalation and conflict resolution.
  de: >-
    Einkaufsverhandlungen vorbereiten (Interessen, Alternativen, Grenzen), Konditionen über den Preis hinaus verhandeln sowie konstruktive, langfristige Lieferantenbeziehungen aufbauen und steuern, einschließlich Eskalation und Konfliktlösung.
prerequisites: [supplier-selection-evaluation, communication-collaboration]
track: role
