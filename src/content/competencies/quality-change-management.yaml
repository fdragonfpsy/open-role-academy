id: quality-change-management
title:
  en: Quality and change management
  de: Qualitäts- und Änderungsmanagement
description:
  en: >-
    Plan quality through acceptance criteria and reviews, control scope changes with a simple change process, assess the impact of changes and support people through the changes a project brings.
  de: >-
    Qualität durch Abnahmekriterien und Reviews planen, Änderungen am Projektumfang mit einem einfachen Änderungsprozess steuern, deren Auswirkungen bewerten und Menschen bei den durch ein Projekt entstehenden Veränderungen begleiten.
prerequisites: [scope-requirements-management]
track: role
