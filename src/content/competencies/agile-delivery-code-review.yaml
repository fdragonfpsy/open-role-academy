id: agile-delivery-code-review
title:
  en: Requirements, agile delivery and code review
  de: Anforderungen, agile Umsetzung und Code-Review
description:
  en: >-
    Turn needs into working software in small steps: user stories and acceptance criteria, backlog refinement, iterations, estimation, reviewing teammates' code constructively and incorporating feedback.
  de: >-
    Bedarfe in kleinen Schritten zu funktionierender Software machen: User Stories und Akzeptanzkriterien, Backlog-Pflege, Iterationen, Schätzung, konstruktives Review des Codes anderer und Umgang mit Feedback.
prerequisites: [communication-collaboration, version-control-collaboration]
track: role
