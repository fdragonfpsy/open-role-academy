id: it-service-management
title:
  en: IT service management basics
  de: Grundlagen des IT-Service-Managements
description:
  en: >-
    Understand how IT services are delivered and supported as services: service desk, service
    catalogue, service levels (SLAs), the difference between incidents, service requests, problems
    and changes, and continual improvement as described in common practice frameworks such as ITIL.
  de: >-
    Verstehen, wie IT-Leistungen als Services erbracht und unterstützt werden: Service Desk,
    Servicekatalog, Service Levels (SLAs), der Unterschied zwischen Incidents, Service Requests,
    Problems und Changes sowie kontinuierliche Verbesserung, wie in gängigen Praxis-Rahmenwerken wie
    ITIL beschrieben.
prerequisites: []
track: role
