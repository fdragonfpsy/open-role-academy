id: meetings-decision-making
title:
  en: Effective meetings and decision-making
  de: Wirksame Meetings und Entscheidungsfindung
description:
  en: >-
    Run meetings that produce results: decide whether a meeting is needed, prepare an agenda, facilitate participation, record decisions and actions, and choose a decision approach (consult, consent, decide alone) with transparent reasoning.
  de: >-
    Meetings leiten, die Ergebnisse bringen: entscheiden, ob ein Meeting nötig ist, eine Agenda vorbereiten, Beteiligung moderieren, Entscheidungen und Aufgaben festhalten und einen Entscheidungsansatz (anhören, Konsent, allein entscheiden) mit nachvollziehbarer Begründung wählen.
prerequisites: [communication-collaboration]
track: role
frameworkRefs:
