id: software-debugging
title:
  en: Debugging and troubleshooting code
  de: Fehlersuche und Debugging im Code
description:
  en: >-
    Find and fix defects systematically: reproducing problems, reading error messages and logs, using a debugger, isolating causes, and verifying and documenting fixes.
  de: >-
    Fehler systematisch finden und beheben: Probleme reproduzieren, Fehlermeldungen und Logs lesen, einen Debugger nutzen, Ursachen eingrenzen sowie Korrekturen prüfen und dokumentieren.
prerequisites: [programming-fundamentals-problem-solving]
track: role
