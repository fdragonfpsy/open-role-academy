id: troubleshooting-methods
title:
  en: Structured troubleshooting
  de: Strukturierte Fehlersuche
description:
  en: >-
    Diagnose technical problems systematically: gather information, reproduce the issue, form and
    test hypotheses, isolate causes layer by layer, use logs and diagnostic tools, apply and verify
    a fix, and document the root cause.
  de: >-
    Technische Probleme systematisch diagnostizieren: Informationen sammeln, das Problem
    nachstellen, Hypothesen bilden und prüfen, Ursachen Schicht für Schicht eingrenzen, Protokolle
    und Diagnosewerkzeuge nutzen, eine Lösung umsetzen und überprüfen sowie die Ursache
    dokumentieren.
prerequisites: []
track: role
