id: ai-regulation-digital-law
title:
  en: AI regulation and digital law overview (EU)
  de: Überblick KI-Regulierung und Digitalrecht (EU)
description:
  en: >-
    Get an overview of the EU digital regulatory landscape at topic level: the risk-based approach of the EU AI Act, obligations for providers and deployers in outline, how AI use connects to data protection, intellectual property and cybersecurity rules, and how to spot when legal review of a digital or AI project is needed.
  de: >-
    Einen Überblick über das digitale Regelwerk der EU auf Themenebene gewinnen: der risikobasierte Ansatz der EU-KI-Verordnung, Pflichten von Anbietern und Betreibern in Grundzügen, Verbindungen von KI-Nutzung zu Datenschutz, geistigem Eigentum und Cybersicherheitsregeln sowie das Erkennen, wann ein digitales oder KI-Projekt rechtlich geprüft werden muss.
prerequisites: [digital-ai-literacy, gdpr-data-protection-compliance]
track: role
