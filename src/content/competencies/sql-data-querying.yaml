id: sql-data-querying
title:
  en: SQL and data querying
  de: SQL und Datenabfragen
description:
  en: >-
    Understand relational data (tables, keys, relationships) and retrieve and aggregate data with SQL: selecting, filtering, joining, grouping and sorting, and writing readable, correct queries.
  de: >-
    Relationale Daten (Tabellen, Schlüssel, Beziehungen) verstehen und Daten mit SQL abrufen und aggregieren: auswählen, filtern, verknüpfen, gruppieren und sortieren sowie lesbare, korrekte Abfragen schreiben.
prerequisites: [data-analytics-fundamentals]
track: role
