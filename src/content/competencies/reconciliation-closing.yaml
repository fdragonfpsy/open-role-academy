id: reconciliation-closing
title:
  en: Reconciliation and period-end closing
  de: Abstimmung und Periodenabschluss
description:
  en: >-
    Reconcile bank and sub-ledger accounts, post accruals, deferrals and depreciation, follow a
    closing checklist and calendar, and investigate and document differences.
  de: >-
    Bank- und Nebenbuchkonten abstimmen, Abgrenzungen und Abschreibungen buchen, einer Abschluss-
    Checkliste und einem Abschlusskalender folgen sowie Differenzen klären und dokumentieren.
prerequisites: [bookkeeping-fundamentals]
track: role
frameworkRefs:
