id: intellectual-property-copyright-basics
title:
  en: Intellectual property and copyright basics (EU/Germany)
  de: Grundlagen des geistigen Eigentums und Urheberrechts (EU/Deutschland)
description:
  en: >-
    Know the main intellectual property rights (copyright, trade marks, patents, designs, trade secrets) at topic level, who owns what in an employment or commissioning context, how licences work (including open licences such as Creative Commons) and how to check simple usage questions.
  de: >-
    Die wichtigsten Schutzrechte des geistigen Eigentums (Urheberrecht, Marken, Patente, Designs, Geschäftsgeheimnisse) auf Themenebene kennen, wissen, wem Rechte im Arbeits- oder Auftragsverhältnis zustehen, wie Lizenzen funktionieren (auch offene Lizenzen wie Creative Commons) und wie einfache Nutzungsfragen geprüft werden.
prerequisites: [legal-foundations-sources-of-law]
track: role
