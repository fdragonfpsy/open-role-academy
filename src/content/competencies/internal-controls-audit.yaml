id: internal-controls-audit
title:
  en: Internal controls and audit readiness
  de: Internes Kontrollsystem und Prüfungsbereitschaft
description:
  en: >-
    Apply internal controls such as segregation of duties and the four-eyes principle, document
    processes, keep records within retention periods and support internal and external audits.
  de: >-
    Interne Kontrollen wie Funktionstrennung und Vier-Augen-Prinzip anwenden, Prozesse
    dokumentieren, Unterlagen innerhalb der Aufbewahrungsfristen aufbewahren und interne wie externe
    Prüfungen unterstützen.
prerequisites: [reconciliation-closing]
track: role
