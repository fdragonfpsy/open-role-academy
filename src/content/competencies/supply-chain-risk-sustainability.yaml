id: supply-chain-risk-sustainability
title:
  en: Supply chain risk and sustainability
  de: Lieferkettenrisiken und Nachhaltigkeit
description:
  en: >-
    Identify and assess risks in the supply chain, reduce dependency on single suppliers, plan for disruptions, and consider environmental and social aspects of suppliers, including the topic of supply chain due diligence laws.
  de: >-
    Risiken in der Lieferkette erkennen und bewerten, Abhängigkeit von einzelnen Lieferanten verringern, für Störungen vorsorgen und ökologische und soziale Aspekte bei Lieferanten berücksichtigen, einschließlich des Themas Lieferkettensorgfaltspflichten.
prerequisites: [supplier-selection-evaluation]
track: role
frameworkRefs:
  - framework: ESCO
    uri: http://data.europa.eu/esco/skill/66db424f-2abe-420d-8e5b-186607266b61
    label: corporate social responsibility
  - framework: ESCO
    uri: http://data.europa.eu/esco/skill/f929c89e-c363-4132-a918-e021d57b307c
    label: supply chain management
