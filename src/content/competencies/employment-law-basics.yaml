id: employment-law-basics
title:
  en: Employment law basics (Germany/EU)
  de: Grundlagen des Arbeitsrechts (Deutschland/EU)
description:
  en: >-
    Know the main sources and rules of employment law in Germany and the EU: employment contracts,
    working time, leave, part-time and fixed-term work, protection against dismissal, equal
    treatment, and the role of works councils and collective agreements — and when to involve legal
    experts.
  de: >-
    Die wichtigsten Quellen und Regeln des Arbeitsrechts in Deutschland und der EU kennen:
    Arbeitsvertrag, Arbeitszeit, Urlaub, Teilzeit und Befristung, Kündigungsschutz, Gleichbehandlung
    sowie die Rolle von Betriebsrat und Tarifverträgen – und wissen, wann rechtliche Expertise nötig
    ist.
prerequisites: []
track: role
