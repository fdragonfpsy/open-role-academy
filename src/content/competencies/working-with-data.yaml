id: working-with-data
title:
  en: Working with data
  de: Arbeiten mit Daten
description:
  en: >-
    Structure, clean and analyse data in spreadsheets: use formulas, sorting, filters and pivot
    tables, create clear charts, check data quality and draw careful conclusions from simple
    descriptive statistics.
  de: >-
    Daten in Tabellenkalkulationen strukturieren, bereinigen und auswerten: Formeln, Sortieren,
    Filter und Pivot-Tabellen nutzen, verständliche Diagramme erstellen, Datenqualität prüfen und
    aus einfachen deskriptiven Kennzahlen vorsichtige Schlüsse ziehen.
prerequisites: [digital-ai-literacy]
track: core
frameworkRefs:
