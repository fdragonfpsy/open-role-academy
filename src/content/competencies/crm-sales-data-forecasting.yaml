id: crm-sales-data-forecasting
title:
  en: CRM, sales data and forecasting
  de: CRM, Vertriebsdaten und Forecast
description:
  en: >-
    Use a CRM system consistently with clean, current data; read core sales metrics (conversion rates, pipeline coverage, cycle length, win rate) and build a realistic sales forecast from the pipeline.
  de: >-
    Ein CRM-System konsequent mit sauberen, aktuellen Daten nutzen, zentrale Vertriebskennzahlen (Konversionsrate, Pipeline-Abdeckung, Verkaufszyklus, Abschlussquote) lesen und aus der Pipeline einen realistischen Forecast ableiten.
prerequisites: [sales-process-pipeline, working-with-data]
track: role
frameworkRefs:
